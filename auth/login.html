<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="auth" data-root="../">

<div class="auth-wrap">

  <div class="between">
    <a class="brand" href="../index.html" aria-label="KonfluenX home">
      <span id="brandSlot"></span>
    </a>
    <button class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
  </div>

  <div class="auth-head">
    <h1>Welcome back</h1>
    <p>Log in to continue</p>
  </div>

  <!-- Login / Sign up switch, as in the mockups -->
  <div class="tabs" data-group style="margin-bottom:24px">
    <span class="tab is-active">Login</span>
    <a class="tab" href="register.html">Sign Up</a>
  </div>

  <form class="auth-form" id="loginForm" novalidate>

    <div class="field">
      <label for="identity">Email or username</label>
      <input class="input" id="identity" type="text" autocomplete="username"
             placeholder="Enter email or username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-affix">
        <input class="input" id="password" type="password" autocomplete="current-password"
               placeholder="Enter password" required>
        <button type="button" class="affix-btn" data-reveal="password" aria-label="Show password">
          <span data-icon="eye" data-icon-size="18"></span>
        </button>
      </div>
      <a class="link t-xs" href="forgot-password.html" style="align-self:flex-end">Forgot password?</a>
    </div>

    <label class="check">
      <input type="checkbox" id="remember" checked>
      <span class="box"><span data-icon="check"></span></span>
      <span class="c-2">Keep me logged in on this device</span>
    </label>

    <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
  </form>

  <div class="auth-divider"><span>or continue with</span></div>

  <a class="btn btn-deriv btn-block btn-lg" href="connect-deriv.html">
    <svg class="deriv-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4h8a8 8 0 0 1 0 16H4V4Z" fill="currentColor"/>
      <path d="M9 9h3a3 3 0 0 1 0 6H9V9Z" fill="var(--mb-bg)"/>
    </svg>
    Continue with Deriv
  </a>

  <div class="auth-foot">
    Don't have an account? <a class="link" href="register.html">Sign up</a>
  </div>

</div>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/pwa.js"></script>
<script>
MB.ready(function () {
  document.getElementById('brandSlot').outerHTML = MB.brand({ large: true });
  MB.mountIcons();

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('identity');
    var pw = document.getElementById('password');
    var ok = true;
    [id, pw].forEach(function (el) {
      var bad = !el.value.trim();
      el.classList.toggle('is-error', bad);
      if (bad) { ok = false; }
    });
    if (!ok) { MB.toast('Enter your details to continue', 'err'); return; }

    var btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    /* Stage 2: POST /api/v1/auth/login */
    MB.api.post('auth/login', { identity: id.value, remember: true })
      .then(function () { location.href = '../users/index.html'; });
  });
});
</script>
</body>
</html>
