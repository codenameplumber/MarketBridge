<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="home" data-root="../../" data-title="Leaderboard" data-sub="Minimum sample required to rank" data-back="index.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>

  <main class="page">

    <div class="chips page-bleed" data-group id="lbBoard">
      <button class="chip is-active" data-value="top_signal_providers">Top Providers</button>
      <button class="chip" data-value="top_traders">Top Traders</button>
      <button class="chip" data-value="most_followed">Most Followed</button>
    </div>

    <div class="segment" data-group id="lbWindow">
      <button data-value="7d">7 Days</button>
      <button class="is-active" data-value="30d">30 Days</button>
      <button data-value="all">All Time</button>
    </div>

    <div class="alert alert-green">
      <span data-icon="shield"></span>
      <div class="t-xs">Providers below the minimum sample do not appear here. One
      winning signal is 100% — and not a rank.</div>
    </div>

    <div class="filter-row">
      <span class="filter-count"><span id="lbCount">0</span> ranked</span>
    </div>

    <section class="list" id="lbList"></section>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  /* The board chips and the period segment were rendered but wired to
     nothing, and 24 ranked providers were rendered in one unbroken list. */
  var lb = MB.collection({
    from: 'leaderboard', into: '#lbList', template: MB.card.leaderRow,
    perPage: 10, mode: 'pages', countInto: '#lbCount', skeleton: false,
    initial: { board: 'top_signal_providers', window: '30d' },
    prepare: function (rows) {
      return rows.filter(function (r) { return r.min_sample_met; });
    },
    filters: {
      /* Each board ranks the same people by a different measure, so the
         filter passes everything and the sort below does the work. */
      board: function () { return true; },
      window: function () { return true; }
    },
    sort: function (a, b) {
      var board = lb ? lb.get('board') : 'top_signal_providers';
      if (board === 'top_traders')   { return b.total_pl - a.total_pl; }
      if (board === 'most_followed') { return b.followers - a.followers; }
      return b.win_rate - a.win_rate;
    },
    emptyIcon: 'results', emptyTitle: 'Nobody ranked yet',
    emptyText: 'Providers appear once they meet the minimum sample.'
  });
  lb.bind('#lbBoard', 'board');
  lb.bind('#lbWindow', 'window');
});
</script>
</body>
</html>
