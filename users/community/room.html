<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="community" data-root="../../" data-title="Room" data-back="index.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <!-- Room header -->
    <section class="card" style="padding:0;overflow:hidden">
      <div class="pad">
        <div class="between">
          <div class="row g3" style="min-width:0">
            <span id="roomAvatar" class="none"></span>
            <div style="min-width:0">
              <div class="t-h3 w-bold truncate" id="rName">—</div>
              <div class="t-xs c-3" id="rMeta">—</div>
            </div>
          </div>
          <div class="row g2 none">
            <button class="icon-btn" id="btnMembers" aria-label="Members">
              <span data-icon="users"></span></button>
            <button class="btn btn-green-soft btn-sm" id="btnJoin">Join</button>
          </div>
        </div>
        <p class="t-sm c-2 mt3" id="rDesc"></p>
        <div class="row g2 mt3" id="rLinks"></div>
      </div>

      <!-- Moderator strip. Removed entirely for everyone else by the
           permission pass, so a normal member never sees these controls. -->
      <div class="mod-strip" data-can="room.monitor">
        <span class="mod-strip-tag">
          <span data-icon="shield" data-icon-size="13"></span> Moderator</span>
        <span class="grow t-xs c-2">You can enter any room and raise what you see.
          You cannot remove or ban &mdash; an admin acts on your flag.</span>
        <button class="btn btn-ghost btn-sm" id="btnFlagRoom" data-can="room.flag">
          <span data-icon="flag"></span> Flag this room</button>
      </div>
      <div class="chart-frame hide" id="rChartWrap" style="border-radius:0">
        <div id="rChart" data-chart="candle" data-h="120"></div>
      </div>
    </section>

    <div class="tabs" data-group id="rTabs">
      <button class="tab is-active" data-value="chat">Chat</button>
      <button class="tab" data-value="posts">Posts</button>
      <button class="tab" data-value="signals">Signals</button>
      <button class="tab" data-value="members">Members</button>
    </div>

    <!-- CHAT -->
    <section id="paneChat">
      <div class="chat" id="chatList"></div>

      <div class="composer mt4" id="chatComposer">
        <div class="composer-previews" id="chatPreviews"></div>
        <div class="composer-row">
          <button class="composer-btn" type="button" data-pick="chatFile" aria-label="Attach image">
            <span data-icon="image"></span></button>
          <button class="composer-btn" type="button" data-pick="chatFile" aria-label="Attach file">
            <span data-icon="file"></span></button>
          <textarea class="composer-input" id="chatInput" rows="1"
                    placeholder="Message the room…" aria-label="Message"></textarea>
          <button class="composer-btn is-send" id="chatSend" aria-label="Send">
            <span data-icon="send"></span></button>
        </div>
        <div class="composer-hint">
          Images and files up to 12&nbsp;MB &middot; drag, paste or browse &middot; 6 per message
        </div>
      </div>
      <input type="file" id="chatFile" multiple hidden
             accept="image/*,.pdf,.csv,.txt,.md,.xlsx,.xls,.docx,.doc,.zip">
    </section>

    <!-- POSTS -->
    <section id="panePosts" class="stack g3 hide"></section>

    <!-- SIGNALS -->
    <section id="paneSignals" class="stack g3 hide"></section>

    <!-- MEMBERS -->
    <section id="paneMembers" class="hide">
      <div class="alert alert-info" id="memberNote" style="margin-bottom:16px">
        <span data-icon="info"></span>
        <div class="t-xs" id="memberNoteText"></div>
      </div>
      <div class="input-icon" style="margin-bottom:12px">
        <span data-icon="search"></span>
        <input class="input" id="memberSearch" type="search" placeholder="Search members…">
      </div>
      <div class="list" id="memberList"></div>
    </section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/uploads.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  var roomId = new URLSearchParams(location.search).get('room');
  var symbol = new URLSearchParams(location.search).get('symbol');
  var room = null;
  var CHAT_KEY = '#chatComposer';

  /* ---------------------------------------------------------------- room */
  MB.api.list('rooms').then(function (rooms) {
    room = rooms.filter(function (r) {
      return roomId ? r.id === roomId : symbol ? r.slug === symbol : false;
    })[0] || rooms[0];

    var isTrader = room.kind === 'trader';
    MB.$('.topbar-title').textContent = room.name;
    document.getElementById('rName').textContent = room.name;
    document.getElementById('rDesc').textContent = room.description;
    document.getElementById('rMeta').textContent =
      MB.fmt.compact(room.member_count) + ' members · ' + room.online_count + ' online' +
      (room.market ? ' · ' + MB.catLabel(room.market.category) : ' · Trader room');

    document.getElementById('roomAvatar').innerHTML = isTrader
      ? MB.avatar(room.owner, 'avatar-lg')
      : '<span class="rc-ic" style="width:48px;height:48px;font-size:12px">' +
        MB.esc((room.market ? room.market.short_name : room.name).slice(0, 4)) + '</span>';

    /* A moderator can read any room without joining it, and can raise the
       room itself. Both controls are stripped for everyone else. */
    var flagRoom = document.getElementById('btnFlagRoom');
    if (flagRoom) {
      flagRoom.addEventListener('click', function () {
        flagSheet({
          title: 'Flag this room',
          preview: room.name + ' — ' + (room.description || 'no description'),
          onSend: function (reason, note) {
            MB.api.post('reports', {
              target_type: 'room', target_id: room.id,
              reason: reason, details: note, source: 'moderator'
            });
            flagRoom.disabled = true;
            flagRoom.innerHTML = MB.icon('check', 16) + ' Raised';
            MB.toast('Room raised to the admins', 'ok');
          }
        });
      });
    }

    var join = document.getElementById('btnJoin');
    if (room.is_owner) { join.textContent = 'Manage'; join.className = 'btn btn-ghost btn-sm'; }
    else if (room.is_member) { join.textContent = 'Joined'; join.className = 'btn btn-ghost btn-sm'; }
    join.addEventListener('click', function () {
      if (room.is_owner) { showTab('members'); return; }
      room.is_member = !room.is_member;
      join.textContent = room.is_member ? 'Joined' : 'Join';
      join.className = 'btn btn-sm ' + (room.is_member ? 'btn-ghost' : 'btn-green-soft');
      MB.api.post('rooms/' + room.id + (room.is_member ? '/join' : '/leave'));
      MB.toast(room.is_member ? 'Joined ' + room.name : 'Left ' + room.name);
    });

    if (room.market) {
      document.getElementById('rChartWrap').classList.remove('hide');
      document.getElementById('rChart').setAttribute('data-seed', room.market.symbol);
      document.getElementById('rLinks').innerHTML =
        '<a class="chip-market" href="../markets/detail.html?symbol=' + room.market.symbol + '">' +
          MB.esc(room.market.name) + '</a>' +
        '<a class="chip-tag" href="../signals/index.html">Signals</a>';
      MB.mountCharts();
    } else if (isTrader) {
      document.getElementById('rLinks').innerHTML =
        '<a class="chip-market" href="../signals/provider.html?u=' + room.owner.username + '">' +
          MB.esc(room.owner.username) + "'s profile</a>";
    }

    renderChat();
    renderMembers();
    MB.mountIcons();

    /* Posts and signals scoped to this room's market */
    /* A market room scopes to its pair; a trader room scopes to its owner.
       Either way the lists page rather than dumping everything at once. */
    var isMarket = !!room.market;
    var postFilter = isMarket
      ? function (p) { return p.market && p.market.symbol === room.market.symbol; }
      : function (p) { return p.author.username === room.owner.username; };
    var sigFilter = isMarket
      ? function (s) { return s.market.symbol === room.market.symbol; }
      : function (s) { return s.author.username === room.owner.username; };

    MB.collection({
      from: 'posts', into: '#panePosts', template: MB.card.post,
      perPage: 6, mode: 'more', skeletonCount: 2,
      prepare: function (rows) { return rows.filter(postFilter); },
      emptyIcon: 'community', emptyTitle: 'No posts yet',
      emptyText: isMarket ? 'Start the conversation about this market.' : ''
    });
    MB.collection({
      from: 'signals', into: '#paneSignals', template: MB.card.sig,
      perPage: 6, mode: 'more', skeletonCount: 2,
      prepare: function (rows) { return rows.filter(sigFilter); },
      emptyIcon: 'signals', emptyTitle: 'No signals yet',
      emptyText: isMarket ? 'Nobody has posted for this market yet.' : ''
    });
  });

  /* ---------------------------------------------------------------- chat */
  var ME = { id:'usr_me', username:'johndavid', display_name:'John David', is_pro:false };
  var messages = [];

  function seedChat() {
    var who = [
      { username:'FX_ProTrader', is_pro:true }, { username:'QueenTrader', is_pro:true },
      { username:'AlphaKing', is_pro:false }, { username:'JamesFX', is_pro:true }
    ];
    var lines = [
      'Market looks bullish on the 1H. Watching for the retest.',
      'Anyone else seeing that liquidity pocket below?',
      'Took partials here, stop at break even now.',
      'Careful around the session open, spread widens.',
      'Chart attached — this is the level I am watching.',
      'Agreed. Structure is clean.',
      'Let us see how London opens.'
    ];
    messages = lines.map(function (t, i) {
      return {
        id: 'm' + i, author: who[i % who.length], body: t,
        attachments: i === 4 ? [{ type:'file', name:'v75-4h-structure.pdf', size:'482 KB' }] : [],
        created_at: new Date(Date.now() - (lines.length - i) * 7 * 60000).toISOString(),
        is_own: false
      };
    });
  }

  function renderChat() {
    if (!messages.length) { seedChat(); }
    var host = document.getElementById('chatList');
    host.innerHTML = messages.map(MB.card.message).join('');
    MB.mountIcons(host);
    /* Strips the flag buttons again for anyone who is not a moderator —
       the chat re-renders on every new message. */
    if (MB.applyPermissions) { MB.applyPermissions(host); }
    wireMessageFlags(host);

    /* Follow the conversation, but only if the reader is already at the
       bottom — yanking them down mid-scroll would be worse than not. */
    if (atEnd) { scrollChatToEnd(); }
  }

  /* Sampled before the re-render, since innerHTML resets scrollTop. */
  var atEnd = true;
  MB.ready(function () {
    var list = document.getElementById('chatList');
    if (!list) { return; }
    list.addEventListener('scroll', function () {
      atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    });
  });

  /* ---- moderator: raise a message ------------------------------------- */
  function wireMessageFlags(host) {
    MB.$$('[data-flag-msg]', host).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-flag-msg');
        var msg = messages.filter(function (m) { return m.id === id; })[0];
        if (!msg || msg.is_flagged) { return; }

        MB.sheet.close();
        flagSheet({
          title: 'Flag this message',
          preview: msg.body || '(attachment only)',
          who: msg.author.username,
          onSend: function (reason, note) {
            msg.is_flagged = true;
            renderChat();
            MB.api.post('reports', {
              target_type: 'message', target_id: id,
              room_id: room && room.id, reason: reason, details: note,
              source: 'moderator'
            });
            MB.toast('Sent to the admins for review', 'ok');
          }
        });
      });
    });
  }

  /* One sheet for both kinds of flag — a message and a whole room. */
  function flagSheet(o) {
    var REASONS = [
      ['spam', 'Spam or advertising'],
      ['scam', 'Scam or fraud attempt'],
      ['abuse', 'Abuse or harassment'],
      ['off_topic', 'Off topic for this room'],
      ['misinformation', 'Misleading trading claim'],
      ['other', 'Something else']
    ];
    var wrap = document.createElement('div');
    wrap.className = 'sheet-backdrop';
    wrap.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-grip"></div>' +
        '<h3 class="t-h2 w-bold">' + MB.esc(o.title) + '</h3>' +
        (o.who ? '<p class="t-xs c-3 mt2">by @' + MB.esc(o.who) + '</p>' : '') +
        '<blockquote class="flag-quote">' + MB.esc(o.preview) + '</blockquote>' +
        '<div class="label mt4">Why are you raising this?</div>' +
        '<div class="chips mt2" data-group id="flagReasons">' +
          REASONS.map(function (r, i) {
            return '<button class="chip' + (i === 0 ? ' is-active' : '') +
              '" data-value="' + r[0] + '">' + r[1] + '</button>';
          }).join('') +
        '</div>' +
        '<div class="label mt4">Anything the admin should know?</div>' +
        '<textarea class="input mt2" id="flagNote" rows="3" ' +
          'placeholder="Optional — context helps them act faster"></textarea>' +
        '<div class="row g2 mt5">' +
          '<button class="btn btn-ghost grow" data-x>Cancel</button>' +
          '<button class="btn btn-sell grow" data-send>Send to admins</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    document.body.style.overflow = 'hidden';

    var reason = REASONS[0][0];
    wrap.querySelector('#flagReasons').addEventListener('mb:change', function (e) {
      reason = e.detail.value;
    });
    function close() {
      document.body.style.overflow = '';
      wrap.classList.remove('is-open');
      setTimeout(function () { wrap.remove(); }, 220);
    }
    wrap.querySelector('[data-x]').addEventListener('click', close);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) { close(); } });
    wrap.querySelector('[data-send]').addEventListener('click', function () {
      o.onSend(reason, (wrap.querySelector('#flagNote').value || '').trim());
      close();
    });
    requestAnimationFrame(function () { wrap.classList.add('is-open'); });
  }

  MB.uploads.attach({ drop: CHAT_KEY, input: '#chatFile', previews: '#chatPreviews', accept: 'any' });

  var input = document.getElementById('chatInput');
  input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(140, this.scrollHeight) + 'px';
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('chatSend').addEventListener('click', send);

  function send() {
    var text = input.value.trim();
    var files = MB.uploads.list(CHAT_KEY);
    if (!text && !files.length) { return; }

    messages.push({
      id: 'm' + Date.now(), author: ME, body: text,
      attachments: files, created_at: new Date().toISOString(), is_own: true
    });
    input.value = '';
    input.style.height = 'auto';
    MB.uploads.clear(CHAT_KEY);
    renderChat();
    document.getElementById('chatList').lastElementChild.scrollIntoView({ behavior:'smooth', block:'nearest' });

    /* Stage 2: multipart POST to /rooms/{id}/messages, storage keys returned */
    MB.api.post('rooms/messages', { room: room && room.id, body: text, attachments: files.length });
  }

  /* ------------------------------------------------------------- members */
  var memberQuery = '';

  function renderMembers() {
    var host = document.getElementById('memberList');
    var note = document.getElementById('memberNoteText');

    if (!room.members) {
      note.textContent = 'Market rooms are open to everyone — there is no member list to manage.';
      host.innerHTML = '<div class="empty" style="padding:40px 20px">' + MB.icon('users', 40) +
        '<h3>Open room</h3><p>Anyone on KonfluenX can read and post here.</p></div>';
      MB.mountIcons(host);
      return;
    }

    note.textContent = room.can_manage_members
      ? 'You own this room. You can remove any member except yourself.'
      : 'Only the room owner can manage members.';

    var rows = room.members.filter(function (m) {
      return !memberQuery || m.user.username.toLowerCase().indexOf(memberQuery) > -1;
    });

    host.innerHTML = rows.length
      ? rows.map(function (m) { return MB.card.member(m, room.can_manage_members); }).join('')
      : '<div class="empty" style="padding:40px 20px">' + MB.icon('search', 40) +
        '<h3>No members match</h3><p>Try another name.</p></div>';
    MB.mountIcons(host);

    MB.$$('[data-remove]', host).forEach(function (b) {
      b.addEventListener('click', function () {
        var name = b.getAttribute('data-remove');
        if (!confirm('Remove ' + name + ' from ' + room.name + '?')) { return; }
        room.members = room.members.filter(function (m) { return m.user.username !== name; });
        room.member_count = Math.max(0, room.member_count - 1);
        document.getElementById('rMeta').textContent =
          MB.fmt.compact(room.member_count) + ' members · ' + room.online_count + ' online · Trader room';
        renderMembers();
        MB.api.del('rooms/' + room.id + '/members/' + name);
        MB.toast(name + ' removed from the room');
      });
    });
  }

  document.getElementById('memberSearch').addEventListener('input', function () {
    memberQuery = this.value.trim().toLowerCase();
    renderMembers();
  });
  document.getElementById('btnMembers').addEventListener('click', function () { showTab('members'); });

  /* ---------------------------------------------------------------- tabs */
  /* Only the Chat tab locks the room to the viewport — the other tabs are
     ordinary scrolling lists. */
  function setChatLayout(on) {
    var app = document.querySelector('.app');
    if (app) { app.classList.toggle('is-chatroom', !!on); }
    if (on) { scrollChatToEnd(); }
  }

  function scrollChatToEnd() {
    var list = document.getElementById('chatList');
    if (list) { list.scrollTop = list.scrollHeight; }
  }

  function showTab(v) {
    ['chat','posts','signals','members'].forEach(function (k) {
      document.getElementById('pane' + k.charAt(0).toUpperCase() + k.slice(1))
        .classList.toggle('hide', k !== v);
    });
    MB.$$('#rTabs .tab').forEach(function (t) {
      t.classList.toggle('is-active', t.getAttribute('data-value') === v);
    });
    setChatLayout(v === 'chat');
  }
  document.getElementById('rTabs').addEventListener('mb:change', function (e) { showTab(e.detail.value); });

  /* Chat is the tab the room opens on. */
  setChatLayout(true);
});
</script>
</body>
</html>
