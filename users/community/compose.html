<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Post — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="community" data-root="../../" data-title="Create Post" data-back="index.html" data-bare data-unread="3">

<div class="app">
  <div data-render="topbar"></div>

  <main class="page">

    <div class="field">
      <label for="pBody">What's on your mind?</label>
      <textarea class="textarea" id="pBody" style="min-height:150px"
        placeholder="Share your read on a market…"></textarea>
    </div>

    <div class="field">
      <label for="pMarket">Tag a market (optional)</label>
      <select class="select" id="pMarket"><option value="">No market</option></select>
      <span class="field-hint">Tagging puts your post in that market's room, where the
      people trading it will actually see it.</span>
    </div>

    <div class="row g3">
      <button class="btn btn-ghost grow"><span data-icon="image"></span> Add image</button>
      <button class="btn btn-ghost grow"><span data-icon="chart"></span> Add chart</button>
    </div>

    <div class="field">
      <label>Publish to</label>
      <div class="segment segment-green" data-group>
        <button class="is-active" data-value="public">Public</button>
        <button data-value="followers">Followers only</button>
      </div>
    </div>

    <button class="btn btn-primary btn-block btn-lg" id="btnPost">Post</button>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/uploads.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  MB.api.list('markets').then(function (rows) {
    var sel = document.getElementById('pMarket');
    sel.innerHTML += rows.map(function (m) {
      return '<option value="' + m.symbol + '">' + m.name + '</option>';
    }).join('');
  });
  document.getElementById('btnPost').addEventListener('click', function () {
    var body = document.getElementById('pBody').value.trim();
    if (!body) { MB.toast('Write something first', 'err'); return; }
    this.disabled = true; this.textContent = 'Posting…';
    MB.api.post('posts', { body: body, market: document.getElementById('pMarket').value })
      .then(function () {
        MB.toast('Posted');
        setTimeout(function () { location.href = 'index.html'; }, 700);
      });
  });
});
</script>
</body>
</html>
