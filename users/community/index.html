<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="community" data-root="../../" data-title="Community" data-sub="Every market has a room. Every trader can have one too." data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <a class="btn btn-primary btn-block" href="compose.html">
      <span data-icon="plus"></span> New Post</a>

    <div class="row g2">
      <div class="input-icon grow">
        <span data-icon="search"></span>
        <input class="input" id="postSearch" type="search" placeholder="Search posts, users, markets…">
      </div>
      <a class="btn btn-ghost none" href="rooms.html">
        <span data-icon="filter"></span> Rooms</a>
    </div>

    <section class="page-section">
      <div class="sec-head"><h2>Rooms</h2><a href="rooms.html">View all</a></div>
      <div class="chips" data-group id="roomTabs">
        <button class="chip is-active" data-value="market">Market Rooms</button>
        <button class="chip" data-value="trader">Trader Rooms</button>
        <button class="chip" data-value="mine">Joined Rooms</button>
      </div>
      <div class="stack g2" id="roomList"></div>
    </section>

    <section class="page-section">
      <div class="sec-head"><h2>Top in Community</h2></div>
      <div class="filter-bar">
        <div class="chips" data-group id="feedTabs">
          <button class="chip is-active" data-value="all">For You</button>
          <button class="chip" data-value="discussion">Discussions</button>
          <button class="chip" data-value="market_talk">Market Talk</button>
        </div>
        <div class="chips" data-group id="catChips"></div>
        <div class="filter-row">
          <select class="select grow" id="pairSel" aria-label="Filter by market">
            <option value="all">All markets</option>
          </select>
          <span class="filter-count"><span id="postCount">0</span> posts</span>
        </div>
      </div>
      <div class="stack g3" id="feed" style="margin-top:12px"></div>
    </section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>

<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

  var CATS = [
    { v:'all', l:'All Markets' }, { v:'synthetic_indices', l:'Synthetics' },
    { v:'derived', l:'Derived' }, { v:'forex', l:'Forex' },
    { v:'crypto', l:'Crypto' }, { v:'commodities', l:'Commodities' },
    { v:'stock_indices', l:'Indices' }
  ];
  function catChips() {
    return CATS.map(function (c, i) {
      return '<button class="chip' + (i === 0 ? ' is-active' : '') + '" data-value="' + c.v + '">' +
        c.l + '</button>';
    }).join('');
  }
  function fillPairs(sel, markets, category) {
    var rows = category === 'all' ? markets
      : markets.filter(function (m) { return m.category === category; });
    sel.innerHTML = '<option value="all">All pairs &amp; markets</option>' +
      rows.map(function (m) {
        return '<option value="' + m.symbol + '">' + m.short_name + '</option>';
      }).join('');
  }

MB.ready(function () {
  document.getElementById('catChips').innerHTML = catChips();
  var pairSel = document.getElementById('pairSel');
  var markets = [];

  var rooms = MB.collection({
    from: 'rooms', into: '#roomList', template: MB.card.roomRow,
    perPage: 5, mode: 'more', skeleton: false,
    initial: { tab: 'market' },
    filters: { tab: function (r, v) { return v === 'mine' ? r.is_member : r.kind === v; } },
    emptyIcon: 'community', emptyTitle: 'No rooms here',
    emptyText: 'Join a market room to see it listed.'
  });
  rooms.bind('#roomTabs', 'tab');

  var feed = MB.collection({
    from: 'posts', into: '#feed', template: MB.card.post,
    perPage: 8, mode: 'pages', countInto: '#postCount', skeletonCount: 3,
    initial: { tab:'all', category:'all', pair:'all', q:'' },
    filters: {
      tab: function (p, v) { return v === 'all' || p.kind === v; },
      category: function (p, v) { return v === 'all' || (p.market && p.market.category === v); },
      pair: function (p, v) { return v === 'all' || (p.market && p.market.symbol === v); },
      q: function (p, v) {
        return (p.author.username + ' ' + p.body + ' ' +
                (p.market ? p.market.name + ' ' + p.market.symbol : '')).toLowerCase().indexOf(v) > -1;
      }
    },
    emptyIcon: 'community', emptyTitle: 'Nothing here yet',
    emptyText: 'Try another market, or be the first to post.'
  });
  feed.bind('#feedTabs', 'tab').bindSelect('#pairSel', 'pair').bindInput('#postSearch', 'q');

  document.getElementById('catChips').addEventListener('mb:change', function (e) {
    fillPairs(pairSel, markets, e.detail.value);
    feed.set('pair', 'all'); feed.set('category', e.detail.value);
  });
  MB.api.list('markets').then(function (rows) {
    markets = rows; fillPairs(pairSel, markets, 'all');
  });
});
</script>
</body>
</html>
