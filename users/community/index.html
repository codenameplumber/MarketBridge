<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/rooms.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="community" data-root="../../" data-title="Community" data-sub="Every market has a room. Every trader can have one too." data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <a class="btn btn-primary btn-block" href="compose.html">
      <span data-icon="plus"></span> New Post</a>

    <div class="row g2">
      <div class="input-icon grow">
        <span data-icon="search"></span>
        <input class="input" id="postSearch" type="search" placeholder="Search posts, users, markets…">
      </div>
      <a class="btn btn-ghost none" href="rooms.html">
        <span data-icon="filter"></span> Rooms</a>
    </div>

    <section class="page-section">
      <div class="chips" data-group id="roomTabs">
        <button class="chip is-active" data-value="market">Market Rooms</button>
        <button class="chip" data-value="trader">Trader Rooms</button>
        <button class="chip" data-value="mine">Joined Rooms</button>
      </div>
      <div class="rooms-head">
        <h2 id="roomsTitle">Popular Rooms</h2>
        <a class="t-sm w-semi c-up" id="roomsMore" href="rooms.html">View all</a>
      </div>
      <div class="chips hide" data-group id="tierChips" aria-label="Room tier">
        <button class="chip is-active" data-value="all">All</button>
        <button class="chip" data-value="trader">Trader</button>
        <button class="chip" data-value="premium">Premium</button>
        <button class="chip" data-value="pro">Pro</button>
      </div>
      <p class="tier-help hide" id="tierHelp">Trader Rooms are open to anyone. <b>Premium</b> rooms have a connected
        Deriv account, so their performance is verified. <b>Pro</b> rooms are paid in KX, after three
        qualifying months and KonfluenX approval.</p>
      <div class="stack g2" id="roomList"></div>
      <a class="btn btn-ghost btn-block hide" id="btnCreateRoom" href="create-room.html">
        <span data-icon="plus"></span> Create your own room</a>
    </section>

    <section class="page-section">
      <div class="sec-head"><h2>Top in Community</h2></div>
      <div class="filter-bar">
        <div class="chips" data-group id="feedTabs">
          <button class="chip is-active" data-value="all">For You</button>
          <button class="chip" data-value="discussion">Discussions</button>
          <button class="chip" data-value="market_talk">Market Talk</button>
        </div>
        <div class="chips" data-group id="catChips"></div>
        <div class="filter-row">
          <select class="select grow" id="pairSel" aria-label="Filter by market">
            <option value="all">All markets</option>
          </select>
          <span class="filter-count"><span id="postCount">0</span> posts</span>
        </div>
      </div>
      <div class="stack g3" id="feed" style="margin-top:12px"></div>
    </section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>

<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/components/rooms.js"></script>
<script src="../../assets/js/core/kx.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

  var CATS = [
    { v:'all', l:'All Markets' }, { v:'synthetic_indices', l:'Synthetics' },
    { v:'derived', l:'Derived' }, { v:'forex', l:'Forex' },
    { v:'crypto', l:'Crypto' }, { v:'commodities', l:'Commodities' },
    { v:'stock_indices', l:'Indices' }
  ];
  function catChips() {
    return CATS.map(function (c, i) {
      return '<button class="chip' + (i === 0 ? ' is-active' : '') + '" data-value="' + c.v + '">' +
        c.l + '</button>';
    }).join('');
  }
  function fillPairs(sel, markets, category) {
    var rows = category === 'all' ? markets
      : markets.filter(function (m) { return m.category === category; });
    sel.innerHTML = '<option value="all">All pairs &amp; markets</option>' +
      rows.map(function (m) {
        return '<option value="' + m.symbol + '">' + m.short_name + '</option>';
      }).join('');
  }

MB.ready(function () {
  document.getElementById('catChips').innerHTML = catChips();
  var pairSel = document.getElementById('pairSel');
  var markets = [];

  /* Rooms: Market (one per pair) · Trader (tiered) · Joined. */
  var startTab = new URLSearchParams(location.search).get('tab');
  var roomTab = ['market', 'trader', 'mine'].indexOf(startTab) > -1 ? startTab : 'market';
  var ROOM_HEAD = {
    market: ['Popular Rooms', 'View all', 'rooms.html'],
    trader: ['Trader Rooms', 'Create', 'create-room.html'],
    mine:   ['Your Joined Rooms', 'Manage', 'rooms.html']
  };
  var rooms = MB.collection({
    from: 'rooms', into: '#roomList', perPage: 6, mode: 'more', skeleton: false,
    template: function (r) {
      return roomTab === 'market' ? MB.card.roomRow(r) : MB.card.roomTier(r, roomTab === 'mine' ? 'joined' : '');
    },
    prepare: function (rows) {
      rows = MB.rooms.merge(rows);
      /* Pro and Premium ahead of plain trader rooms, then most members. */
      var rank = { pro: 0, premium: 1, trader: 2 };
      return rows.sort(function (a, b) {
        var ta = rank[MB.rooms.tier(a)], tb = rank[MB.rooms.tier(b)];
        ta = ta === undefined ? 3 : ta; tb = tb === undefined ? 3 : tb;
        if (ta !== tb) { return ta - tb; }
        return (b.member_count || 0) - (a.member_count || 0);
      });
    },
    initial: { tab: roomTab, tier: 'all' },
    filters: {
      tab: function (r, v) { return v === 'mine' ? (r.is_member || r.is_owner) : r.kind === v; },
      tier: function (r, v) { return v === 'all' || roomTab !== 'trader' || MB.rooms.tier(r) === v; }
    },
    emptyIcon: 'community', emptyTitle: 'No rooms here',
    emptyText: 'Join a market room or a trader room to see it listed.'
  });
  function paintRoomTab() {
    var h = ROOM_HEAD[roomTab];
    MB.$('#roomsTitle').textContent = h[0];
    MB.$('#roomsMore').textContent = h[1];
    MB.$('#roomsMore').setAttribute('href', h[2]);
    MB.$('#tierChips').classList.toggle('hide', roomTab !== 'trader');
    MB.$('#tierHelp').classList.toggle('hide', roomTab !== 'trader');
    MB.$('#btnCreateRoom').classList.toggle('hide', roomTab !== 'trader');
    MB.$$('#roomTabs .chip').forEach(function (c) {
      c.classList.toggle('is-active', c.getAttribute('data-value') === roomTab);
    });
  }
  paintRoomTab();
  MB.$('#roomTabs').addEventListener('mb:change', function (e) {
    roomTab = e.detail.value; paintRoomTab(); rooms.set('tab', roomTab);
  });
  rooms.bind('#tierChips', 'tier');
  MB.rooms.wireList(MB.$('#roomList'), function () { return rooms.all(); }, function () { rooms.refresh(); });

  var feed = MB.collection({
    from: 'posts', into: '#feed', template: MB.card.post,
    perPage: 8, mode: 'pages', countInto: '#postCount', skeletonCount: 3,
    initial: { tab:'all', category:'all', pair:'all', q:'' },
    filters: {
      tab: function (p, v) { return v === 'all' || p.kind === v; },
      category: function (p, v) { return v === 'all' || (p.market && p.market.category === v); },
      pair: function (p, v) { return v === 'all' || (p.market && p.market.symbol === v); },
      q: function (p, v) {
        return (p.author.username + ' ' + p.body + ' ' +
                (p.market ? p.market.name + ' ' + p.market.symbol : '')).toLowerCase().indexOf(v) > -1;
      }
    },
    emptyIcon: 'community', emptyTitle: 'Nothing here yet',
    emptyText: 'Try another market, or be the first to post.'
  });
  feed.bind('#feedTabs', 'tab').bindSelect('#pairSel', 'pair').bindInput('#postSearch', 'q');

  document.getElementById('catChips').addEventListener('mb:change', function (e) {
    fillPairs(pairSel, markets, e.detail.value);
    feed.set('pair', 'all'); feed.set('category', e.detail.value);
  });
  MB.api.list('markets').then(function (rows) {
    markets = rows; fillPairs(pairSel, markets, 'all');
  });
});
</script>
</body>
</html>
