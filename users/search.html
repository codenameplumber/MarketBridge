<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="home" data-root="../" data-title="Search" data-back="index.html" data-bare data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <div class="input-icon">
      <span data-icon="search"></span>
      <input class="input" id="q" type="search" placeholder="Search markets, traders, signals, posts…" autofocus>
    </div>

    <div class="chips page-bleed" data-group id="sTabs">
      <button class="chip is-active" data-value="all">All</button>
      <button class="chip" data-value="markets">Markets</button>
      <button class="chip" data-value="traders">Traders</button>
      <button class="chip" data-value="signals">Signals</button>
      <button class="chip" data-value="posts">Posts</button>
      <button class="chip" data-value="resources">Resources</button>
    </div>

    <div id="results"></div>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  var data = {}, tab = 'all', q = '';

  Promise.all([
    MB.api.list('markets'), MB.api.list('providers'),
    MB.api.list('signals'), MB.api.list('posts'), MB.api.list('resources')
  ]).then(function (r) {
    data = { markets: r[0], traders: r[1], signals: r[2], posts: r[3], resources: r[4] };
    paint();
  });

  function section(title, rows, tpl, more) {
    if (!rows.length) { return ''; }
    return '<section class="page-section" style="margin-bottom:20px">' +
      '<div class="sec-head"><h2>' + title + '</h2>' +
      (more ? '<a href="' + more + '">View all</a>' : '') + '</div>' +
      '<div class="' + (tpl.wrap || 'list') + '">' + rows.map(tpl.fn).join('') + '</div></section>';
  }

  function paint() {
    var host = document.getElementById('results');
    if (!q) {
      host.innerHTML = '<div class="empty">' + MB.icon('search', 46) +
        '<h3>Search KonfluenX</h3><p>Find a market, a trader, a signal, ' +
        'a discussion or a course.</p></div>';
      MB.mountIcons(host); return;
    }
    var m = function (s) { return s.toLowerCase().indexOf(q) > -1; };
    var out = '';
    if (tab === 'all' || tab === 'markets') {
      out += section('Markets', (data.markets || []).filter(function (x) {
        return m(x.name + ' ' + x.symbol); }).slice(0, 4),
        { fn: MB.card.marketRow }, MB.url('users/markets/index.html'));
    }
    if (tab === 'all' || tab === 'traders') {
      out += section('Traders', (data.traders || []).filter(function (x) {
        return m(x.username); }).slice(0, 4),
        { fn: function (u) {
          return '<a class="list-row" href="' + MB.url('users/signals/provider.html?u=') + u.username + '">' +
            MB.avatar(u, 'avatar-sm') + '<span class="grow"><span class="lr-title" style="display:block">' +
            u.username + '</span><span class="lr-sub">' + u.win_rate + '% win rate · ' +
            u.signals_count + ' signals</span></span></a>'; } });
    }
    if (tab === 'all' || tab === 'signals') {
      out += section('Signals', (data.signals || []).filter(function (x) {
        return m(x.body + ' ' + x.market.name + ' ' + x.author.username); }).slice(0, 3),
        { wrap: 'stack g3', fn: MB.card.signalMini });
    }
    if (tab === 'all' || tab === 'posts') {
      out += section('Posts', (data.posts || []).filter(function (x) {
        return m(x.body + ' ' + x.author.username); }).slice(0, 3),
        { wrap: 'stack g3', fn: MB.card.post });
    }
    if (tab === 'all' || tab === 'resources') {
      out += section('Resources', (data.resources || []).filter(function (x) {
        return m(x.title + ' ' + x.summary); }).slice(0, 4),
        { fn: function (r) {
          return '<a class="list-row" href="' + MB.url('users/resources/detail.html?slug=') + r.slug + '">' +
            '<span class="lr-icon" style="color:var(--mb-green)">' + MB.icon('book', 20) + '</span>' +
            '<span class="grow"><span class="lr-title" style="display:block">' + r.title + '</span>' +
            '<span class="lr-sub">' + r.summary + '</span></span></a>'; } });
    }
    host.innerHTML = out || '<div class="empty">' + MB.icon('search', 46) +
      '<h3>No results for "' + MB.esc(q) + '"</h3><p>Try a different term.</p></div>';
    MB.mountIcons(host); MB.mountCharts(host); MB.mountTicks(host);
  }

  document.getElementById('q').addEventListener('input', function () {
    q = this.value.trim().toLowerCase(); paint();
  });
  document.getElementById('sTabs').addEventListener('mb:change', function (e) {
    tab = e.detail.value; paint();
  });
  paint();
});
</script>
</body>
</html>
