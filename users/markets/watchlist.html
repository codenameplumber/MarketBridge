<body data-shell="app" data-nav="markets" data-root="../../" data-title="Watchlist" data-sub="Markets you follow" data-back="index.html" data-unread="3">

  <div data-render="topbar"></div>

  <main class="page">
<section class="list" id="watchList"></section>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>

<script>

MB.ready(function () {
  MB.collection({
    from: 'markets', into: '#watchList', template: MB.card.marketRow,
    perPage: 10, mode: 'pages', countInto: '#wlCount', skeleton: false,
    prepare: function (rows) {
      return rows.filter(function (m) { return m.is_favorite; });
    },
    emptyIcon: 'star', emptyTitle: 'No markets saved',
    emptyText: 'Tap the star on any market to keep it here.'
  });
});
</script>
