<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markets — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="markets" data-root="../../" data-title="Markets" data-sub="Every tradable market, in one place" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <div class="row g2">
      <div class="input-icon grow">
        <span data-icon="search"></span>
        <input class="input" id="mktSearch" type="search" placeholder="Search markets or pairs…">
      </div>
      <a class="btn btn-ghost none" href="watchlist.html">
        <span data-icon="star"></span> Favourites</a>
    </div>

    <div class="filter-bar">
      <div class="chips" data-group id="catChips"></div>
      <div class="filter-row">
        <select class="select grow" id="kindSel" aria-label="Filter by contract type">
          <option value="all">Any contract type</option>
          <option value="binary">Binary</option>
          <option value="multiplier">Multipliers</option>
          <option value="cfd">CFD (MT5)</option>
          <option value="favorites">My watchlist</option>
        </select>
        <span class="filter-count"><span id="mktCount">0</span> markets</span>
      </div>
    </div>

    <section class="stack g2" id="marketList"></section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>

<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

  var CATS = [
    { v:'all', l:'All Markets' }, { v:'synthetic_indices', l:'Synthetics' },
    { v:'derived', l:'Derived' }, { v:'forex', l:'Forex' },
    { v:'crypto', l:'Crypto' }, { v:'commodities', l:'Commodities' },
    { v:'stock_indices', l:'Indices' }
  ];
  function catChips() {
    return CATS.map(function (c, i) {
      return '<button class="chip' + (i === 0 ? ' is-active' : '') + '" data-value="' + c.v + '">' +
        c.l + '</button>';
    }).join('');
  }
  function fillPairs(sel, markets, category) {
    var rows = category === 'all' ? markets
      : markets.filter(function (m) { return m.category === category; });
    sel.innerHTML = '<option value="all">All pairs &amp; markets</option>' +
      rows.map(function (m) {
        return '<option value="' + m.symbol + '">' + m.short_name + '</option>';
      }).join('');
  }

MB.ready(function () {
  document.getElementById('catChips').innerHTML = catChips();

  var c = MB.collection({
    from: 'markets', into: '#marketList', template: MB.card.mktRow,
    perPage: 10, mode: 'pages', countInto: '#mktCount',
    initial: { category: 'all', kind: 'all', q: '' },
    filters: {
      category: function (m, v) { return v === 'all' || m.category === v; },
      kind: function (m, v) {
        if (v === 'all') { return true; }
        if (v === 'favorites') { return m.is_favorite; }
        return (m.contract_kinds || []).some(function (k) {
          return v === 'cfd' ? k === 'cfd_mt5' : k === v;
        });
      },
      q: function (m, v) {
        return (m.name + ' ' + m.symbol + ' ' + (m.pair || '')).toLowerCase().indexOf(v) > -1;
      }
    },
    emptyIcon: 'search', emptyTitle: 'No markets match',
    emptyText: 'Try another category or clear the search.'
  });
  c.bind('#catChips', 'category').bindSelect('#kindSel', 'kind').bindInput('#mktSearch', 'q');
});
</script>
</body>
</html>
