<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="markets" data-root="../../" data-title="Market" data-back="index.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>

  <main class="page">

    <section class="card" style="padding:0;overflow:hidden">
      <div class="market-hero" style="border-bottom:0">
        <div class="between">
          <div>
            <div class="mh-name" id="mName">—</div>
            <div class="mh-price" id="mPrice">—</div>
            <div class="mh-change" id="mChange">—</div>
          </div>
          <button class="icon-btn none" id="btnStar" aria-label="Add to watchlist">
            <span data-icon="star"></span></button>
        </div>
      </div>
      <div class="chart-frame" style="border-radius:0">
        <span class="tf">1m</span>
        <div id="mChart" data-chart="candle" data-h="200" data-axis></div>
      </div>
    </section>

    <!-- The five faces of a market — this is the join key made visible -->
    <div class="tabs" data-group id="mktTabs">
      <button class="tab is-active" data-value="trade">Trade</button>
      <button class="tab" data-value="signals">Signals</button>
      <button class="tab" data-value="analysis">Analysis</button>
      <button class="tab" data-value="community">Community</button>
      <button class="tab" data-value="traders">Traders</button>
    </div>

    <section id="paneTrade" class="page-section">
      <div class="stack g3" id="tradeOptions"></div>
    </section>

    <section id="paneSignals" class="page-section hide">
      <div class="stack g4" id="mktSignals"></div>
    </section>

    <section id="paneAnalysis" class="page-section hide">
      <div class="stack g4" id="mktAnalysis"></div>
    </section>

    <section id="paneCommunity" class="page-section hide">
      <div class="between">
        <div><div class="t-sm w-bold" id="roomName">Market room</div>
          <div class="t-xs c-3" id="roomMembers">—</div></div>
        <a class="btn btn-green-soft btn-sm" href="../community/room.html">Open room</a>
      </div>
      <div class="stack g3" id="mktPosts"></div>
    </section>

    <section id="paneTraders" class="page-section hide">
      <div class="stack g2" id="mktTraders"></div>
    </section>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  var symbol = new URLSearchParams(location.search).get('symbol') || '1HZ75V';

  MB.api.list('markets').then(function (rows) {
    var m = rows.filter(function (x) { return x.symbol === symbol; })[0] || rows[0];
    symbol = m.symbol;
    document.title = m.name + ' — KonfluenX';
    MB.$('.topbar-title').textContent = m.short_name;
    document.getElementById('mName').textContent = m.name;
    document.getElementById('mPrice').setAttribute('data-tick', m.symbol);
    document.getElementById('mPrice').setAttribute('data-tick-dp', m.decimal_places);
    document.getElementById('mPrice').textContent = MB.fmt.price(m.stats.last_price, m.decimal_places);
    var up = m.stats.change_pct_24h >= 0;
    var ch = document.getElementById('mChange');
    ch.textContent = MB.fmt.pct(m.stats.change_pct_24h);
    ch.className = 'mh-change ' + (up ? 'c-up' : 'c-down');
    document.getElementById('mChart').setAttribute('data-seed', m.symbol);
    document.getElementById('mChart').setAttribute('data-direction', up ? 'up' : 'down');
    document.getElementById('roomName').textContent = m.short_name + ' Community';
    document.getElementById('roomMembers').textContent =
      MB.fmt.compact(m.community.member_count) + ' members · ' +
      MB.fmt.compact(m.community.post_count) + ' posts';
    MB.mountCharts(); MB.mountTicks();

    /* Trading options for THIS market come from the registry, never a
       hard-coded list — a contract Deriv cannot execute here never appears. */
    MB.api.list('capabilities').then(function (caps) {
      var routes = { accumulator: 'accumulators', rise_fall: 'rise-fall', digits: 'digits', multipliers: 'multipliers' };
      var usable = caps.filter(function (c) {
        return c.execution_mode === 'native' && c.is_enabled &&
               (c.markets || []).indexOf(symbol) > -1 && routes[c.contract_family];
      });
      var host = document.getElementById('tradeOptions');
      if (!usable.length) {
        host.innerHTML = '<div class="alert alert-info">' + MB.icon('info', 18) +
          '<div>No contracts are executable on this market from KonfluenX right now. ' +
          'Signals for it will appear as analysis.</div></div>';
        MB.mountIcons(host); return;
      }
      host.innerHTML = usable.map(function (c) {
        return '<a class="trade-launch" href="../trade/' + routes[c.contract_family] +
          '.html?symbol=' + symbol + '">' +
          '<span class="tl-icon fam-head ' + ({accumulator:'fam-accu',rise_fall:'fam-rise',digits:'fam-digit',multipliers:'fam-multi'}[c.contract_family]||'') + '">' +
          MB.icon({accumulator:'accumulator',rise_fall:'risefall',digits:'digits',multipliers:'multipliers'}[c.contract_family], 24) +
          '</span><span class="grow"><span class="tl-name" style="display:block">' + c.label + '</span>' +
          '<span class="tl-desc">' + c.description + '</span></span>' +
          '<span class="none c-3">' + MB.icon('chevright', 18) + '</span></a>';
      }).join('');
      MB.mountIcons(host);
    });
  });

  var byKind = function (kind) {
    return function (s) { return s.market.symbol === symbol && s.kind === kind; };
  };

  /* Each tab is its own paged collection — a busy market can carry dozens of
     signals and hundreds of posts. */
  MB.collection({
    from: 'signals', into: '#mktSignals', template: MB.card.signal,
    perPage: 5, mode: 'more', skeletonCount: 2,
    prepare: function (rows) { return rows.filter(byKind('executable')); },
    emptyIcon: 'signals', emptyTitle: 'No executable signals',
    emptyText: 'Nobody has posted a tradeable signal for this market yet.'
  });

  MB.collection({
    from: 'signals', into: '#mktAnalysis', template: MB.card.signal,
    perPage: 5, mode: 'more', skeletonCount: 2,
    prepare: function (rows) { return rows.filter(byKind('analysis')); },
    emptyIcon: 'chart', emptyTitle: 'No analysis yet',
    emptyText: 'Be the first to share your read on this market.'
  });

  MB.collection({
    from: 'posts', into: '#mktPosts', template: MB.card.post,
    perPage: 6, mode: 'more', skeletonCount: 2,
    prepare: function (rows) {
      return rows.filter(function (p) { return p.market && p.market.symbol === symbol; });
    },
    emptyIcon: 'community', emptyTitle: 'Quiet in here',
    emptyText: 'Start the conversation about this market.'
  });

  MB.render({ into: '#mktTraders', from: 'providers', limit: 5,
    template: function (u) {
      return '<a class="list-row" href="../signals/provider.html?u=' + u.username + '">' +
        MB.avatar(u, 'avatar-sm') +
        '<span class="grow"><span class="lr-title" style="display:block">' + u.username + '</span>' +
        '<span class="lr-sub">' + u.stats.total_signals + ' signals · ' + u.win_rate + '% win rate</span></span>' +
        '<span class="btn btn-green-soft btn-xs none">Follow</span></a>';
    } });

  document.getElementById('mktTabs').addEventListener('mb:change', function (e) {
    ['trade','signals','analysis','community','traders'].forEach(function (k) {
      var pane = document.getElementById('pane' + k.charAt(0).toUpperCase() + k.slice(1));
      pane.classList.toggle('hide', k !== e.detail.value);
    });
  });

  document.getElementById('btnStar').addEventListener('click', function () {
    var on = this.classList.toggle('is-on');
    this.innerHTML = MB.icon(on ? 'starfill' : 'star', 21);
    this.style.color = on ? 'var(--mb-green)' : '';
    MB.toast(on ? 'Added to watchlist' : 'Removed from watchlist');
  });
});
</script>
</body>
</html>
