<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transaction History — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="home" data-root="../../" data-title="Transaction History" data-sub="Deposits, withdrawals and transfers" data-back="accounts.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <div class="chips" data-group id="txTabs">
      <button class="chip is-active" data-value="all">All</button>
      <button class="chip" data-value="deposit">Deposits</button>
      <button class="chip" data-value="withdrawal">Withdrawals</button>
      <button class="chip" data-value="transfer">Transfers</button>
    </div>
    <div class="filter-row">
      <span class="filter-count"><span id="txCount">0</span> records</span>
    </div>
    <section class="list" id="txList"></section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/roles.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  /* Deposits and withdrawals are handoffs; transfers move between the
     user's own Deriv accounts. Both belong in one history. */
  Promise.all([MB.api.list('transfers'), MB.api.get('me')]).then(function (r) {
    var transfers = r[0].map(function (t) {
      return { kind: 'transfer', label: t.from + ' → ' + t.to, ref: t.reference,
               amount: t.amount, currency: t.currency, status: t.status, at: t.created_at };
    });
    var seeded = [];
    for (var i = 0; i < 26; i++) {
      var dep = i % 2 === 0;
      seeded.push({
        kind: dep ? 'deposit' : 'withdrawal',
        label: dep ? 'Deposit via ' + (i % 4 ? 'Kaastro' : 'Deriv')
                   : 'Withdrawal via ' + (i % 3 ? 'Kaastro' : 'Deriv'),
        ref: 'MB' + (420000 + i * 311),
        amount: Math.round((40 + (i * 137) % 1800) * 100) / 100,
        currency: 'USD',
        status: i % 11 === 0 ? 'pending' : i % 13 === 0 ? 'failed' : 'completed',
        at: new Date(Date.now() - (i * 9 + 4) * 3600000).toISOString()
      });
    }
    var all = transfers.concat(seeded)
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); });

    var c = MB.collection({
      data: all, into: '#txList', perPage: 12, mode: 'pages',
      countInto: '#txCount', skeleton: false,
      initial: { kind: 'all' },
      filters: { kind: function (t, v) { return v === 'all' || t.kind === v; } },
      template: function (t) {
        var ic = { deposit: 'download', withdrawal: 'upload', transfer: 'refresh' }[t.kind];
        var tone = t.kind === 'deposit' ? 'c-up' : t.kind === 'withdrawal' ? 'c-down' : 'c-2';
        var sign = t.kind === 'deposit' ? '+' : t.kind === 'withdrawal' ? '-' : '';
        var st = { completed: 'badge-active', pending: 'badge-warn', failed: 'badge-lost' }[t.status];
        return '<div class="list-row">' +
          '<span class="lr-icon">' + MB.icon(ic, 20) + '</span>' +
          '<span class="grow" style="min-width:0">' +
            '<span class="lr-title truncate" style="display:block">' + MB.esc(t.label) + '</span>' +
            '<span class="lr-sub">' + MB.esc(t.ref) + ' · ' + MB.fmt.ago(t.at) + '</span></span>' +
          '<span class="none" style="text-align:right">' +
            '<span class="lr-value num ' + tone + '" style="display:block;font-weight:700">' +
              sign + MB.fmt.money(t.amount, t.currency) + '</span>' +
            '<span class="badge ' + st + '">' + t.status + '</span></span></div>';
      },
      emptyIcon: 'clock', emptyTitle: 'Nothing here',
      emptyText: 'Records will appear as you deposit, withdraw or transfer.'
    });
    c.bind('#txTabs', 'kind');
  });
});
</script>
</body>
</html>
