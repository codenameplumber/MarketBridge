<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications — KonfluenX</title>
<meta name="theme-color" content="#080B0F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="app" data-nav="home" data-root="../" data-title="Notifications" data-back="index.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>
  <main class="page">

    <div class="between">
      <div class="chips" data-group id="nTabs" style="flex:1">
        <button class="chip is-active" data-value="all">All</button>
        <button class="chip" data-value="signal">Signals</button>
        <button class="chip" data-value="community">Community</button>
        <button class="chip" data-value="system">System</button>
      </div>
      <button class="btn btn-xs btn-green-soft none" id="markAll">Mark all read</button>
    </div>
    <section class="list" id="notifList"></section>
  </main>
  <div data-render="tabbar"></div>
</div>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/core/signal-tracker.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  var all = [], tab = 'all';
  var GROUP = {
    signal_posted: 'signal', signal_result: 'signal', signal_updated: 'signal',
    comment: 'community', reply: 'community', follow: 'community', mention: 'community',
    system: 'system', moderation: 'system'
  };
  function paint() {
    var rows = all.filter(function (n) { return tab === 'all' || GROUP[n.type] === tab; });
    var host = document.getElementById('notifList');
    if (!rows.length) {
      host.innerHTML = '<div class="empty">' + MB.icon('bell', 46) +
        '<h3>Nothing new</h3><p>You are all caught up.</p></div>';
      MB.mountIcons(host); return;
    }
    host.innerHTML = rows.map(MB.card.notification).join('');
    MB.mountIcons(host);
  }
  MB.api.list('notifications').then(function (rows) {
    all = MB.signalTracker.notifications().concat(rows);
    paint();
  });
  MB.signalTracker.on(function (s) {
    if (s.status !== 'won' && s.status !== 'lost') { return; }
    all = MB.signalTracker.notifications().concat(all.filter(function (n) { return String(n.id).indexOf('loc_') !== 0; }));
    paint();
  });
  document.getElementById('nTabs').addEventListener('mb:change', function (e) { tab = e.detail.value; paint(); });
  document.getElementById('markAll').addEventListener('click', function () {
    all = all.map(function (n) { n.read_at = new Date().toISOString(); return n; });
    paint();
    MB.api.post('notifications/read-all');
    MB.toast('All marked as read');
  });
});
</script>
</body>
</html>
