<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communities — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="superadmin" data-nav="community" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Communities</h1>
        <div class="sub" id="pageSub">Market rooms and trader rooms, managed in one place</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-primary btn-sm none" id="btnNewRoom"><span data-icon="plus"></span> New room</button>
    </header>
    <main class="admin-body">
      
      <div id="stats"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  /* slide-over quick view */
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  MB.api.get('admin/communities').then(function (res) {
    var rows = res.data, m = res.meta;

    MB.statSlider('#stats', 'Communities', [
      { k:'Total communities', v: m.total, d: 7.4 },
      { k:'Market rooms', v: m.market_rooms, note:'one per pair' },
      { k:'Trader rooms', v: m.trader_rooms, d: 12.1 },
      { k:'Total members', v: MB.fmt.compact(m.total_members), d: 9.6 },
      { k:'Posts', v: MB.fmt.compact(m.total_posts), d: 5.2 },
      { k:'Messages (7d)', v: MB.fmt.compact(m.messages_7d), d: 14.8 },
      { k:'Flagged', v: m.flagged, tone: m.flagged ? 'warn' : '', d: -3.1 },
      { k:'Blocked', v: m.blocked, tone: m.blocked ? 'danger' : '', spark:false }
    ]);

    MB.datatable({
      data: rows, into: '#table', perPage: 15, selectable: true, sortKey: 'members', sortDir: 'desc',
      searchPlaceholder: 'Search communities, owners or markets…',
      search: ['name','owner','slug'],
      columns: [
        { key:'name', label:'Community', sortable:true,
          render: function (c) {
            return '<a class="cell-link" href="community-detail.html?c=' + c.id + '">' +
              '<div class="cell-user">' +
                '<span class="rc-ic">' + MB.esc((c.market ? c.market.short_name : c.name).slice(0,4)) + '</span>' +
                '<div><div class="n">' + MB.esc(c.name) + '</div>' +
                '<div class="h">' + (c.market ? MB.catLabel(c.category) : 'Trader room') + '</div></div>' +
              '</div></a>'; } },
        { key:'kind', label:'Type', sortable:true, filter:['market','trader'],
          render: function (c) { return '<span class="badge ' +
            (c.kind === 'market' ? 'badge-info' : 'badge-neutral') + '">' + c.kind + '</span>'; } },
        { key:'owner', label:'Owner', sortable:true,
          render: function (c) { return c.kind === 'trader'
            ? userCell(c.owner, 'created it', 'user-detail.html?u=' + c.owner)
            : '<span class="c-3">KonfluenX</span>'; } },
        { key:'members', label:'Members', sortable:true, numeric:true,
          render: function (c) { return MB.fmt.compact(c.members); } },
        { key:'posts', label:'Posts', sortable:true, numeric:true,
          render: function (c) { return MB.fmt.compact(c.posts); } },
        { key:'messages_7d', label:'Msgs 7d', sortable:true, numeric:true,
          render: function (c) { return MB.fmt.compact(c.messages_7d); } },
        { key:'reports', label:'Reports', sortable:true, numeric:true,
          render: function (c) { return c.reports
            ? '<span class="badge badge-lost">' + c.reports + '</span>' : '0'; } },
        { key:'status', label:'Status', sortable:true, filter:['active','flagged','blocked'],
          render: function (c) { return statusBadge(c.status); } },
        { key:'', label:'Actions', align:'right',
          render: function (c) {
            return acts('<a class="row-action" href="community-detail.html?c=' + c.id + '" aria-label="Open">' +
              MB.icon('eye', 15) + '</a>' +
              '<button class="row-action is-reject" data-can="community.block" data-block="' + c.id + '" aria-label="Block">' +
              MB.icon('ban', 15) + '</button>'); } }
      ],
      done: function () {
        MB.$$('[data-block]').forEach(function (b) {
          b.addEventListener('click', function () {
            var c = rows.filter(function (x) { return x.id === b.getAttribute('data-block'); })[0];
            if (!c || !confirm((c.status === 'blocked' ? 'Unblock ' : 'Block ') + c.name + '?')) { return; }
            c.status = c.status === 'blocked' ? 'active' : 'blocked';
            MB.api.patch('admin/communities/' + c.id, { status: c.status });
            MB.toast(c.name + ' ' + c.status);
          });
        });
      }
    });
  });
});
</script>
</body>
</html>
