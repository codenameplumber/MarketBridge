<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="superadmin" data-nav="community" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      <a class="icon-btn none" href="community.html" aria-label="Back"><span data-icon="back"></span></a>
      <div class="grow">
        <h1 id="pageTitle">Community</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      
    </header>
    <main class="admin-body">
      
      <div class="detail-hero" id="hero"></div>
      <div id="stats"></div>

      <div class="admin-tabs" id="tabs">
        <button class="is-active" data-t="overview">Overview</button>
        <button data-t="activity">Activity</button>
        <button data-t="members">Members</button>
        <button data-t="moderation">Moderation</button>
      </div>

      <div id="paneOverview"></div>
      <div id="paneActivity" class="hide"></div>
      <div id="paneMembers" class="hide"></div>
      <div id="paneModeration" class="hide"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  /* slide-over quick view */
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  var id = new URLSearchParams(location.search).get('c');

  Promise.all([MB.api.list('admin/communities'), MB.api.list('rooms'), MB.api.list('admin/users')])
    .then(function (r) {
      var c = r[0].filter(function (x) { return x.id === id; })[0] || r[0][0];
      var room = r[1].filter(function (x) { return x.id === c.id; })[0] || {};
      var users = r[2];

      document.getElementById('pageTitle').textContent = c.name;
      document.getElementById('pageSub').textContent =
        (c.kind === 'market' ? 'Market room' : 'Trader room') + ' · ' + MB.fmt.compact(c.members) + ' members';

      document.getElementById('hero').innerHTML =
        (c.kind === 'trader'
          ? MB.avatar({ username: c.owner }, 'avatar-xl')
          : '<span class="rc-ic" style="width:72px;height:72px;font-size:16px;border-radius:14px">' +
            MB.esc((c.market ? c.market.short_name : c.name).slice(0,4)) + '</span>') +
        '<div class="dh-main">' +
          '<div class="dh-name">' + MB.esc(c.name) + '</div>' +
          '<div class="dh-sub">Created ' + MB.fmt.date(c.created_at) + ' by ' + MB.esc(c.created_by) + '</div>' +
          '<div class="dh-badges">' + statusBadge(c.status) +
            '<span class="badge ' + (c.kind === 'market' ? 'badge-info' : 'badge-neutral') + '">' + c.kind + ' room</span>' +
            (c.market ? '<span class="badge badge-neutral">' + MB.catLabel(c.category) + '</span>' : '') +
            '<span class="badge badge-neutral">' + c.visibility + '</span>' +
            (c.reports ? '<span class="badge badge-lost">' + c.reports + ' reports</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="dh-actions">' +
          (c.market ? '<a class="btn btn-ghost btn-sm" data-can="market.edit" href="markets.html">' +
            MB.icon('markets', 16) + ' Market</a>' : '') +
          '<button class="btn btn-ghost btn-sm"><span data-icon="megaphone"></span> Announce</button>' +
          '<button class="btn btn-ghost btn-sm" id="btnFlag"><span data-icon="flag"></span> Flag</button>' +
          '<button class="btn btn-sell btn-sm" id="btnBlock"><span data-icon="ban"></span> ' +
            (c.status === 'blocked' ? 'Unblock' : 'Block') + '</button>' +
        '</div>';

      MB.statSlider('#stats', 'This community', [
        { k:'Members', v: MB.fmt.compact(c.members), d: 8.2 },
        { k:'Online now', v: c.online, spark:false },
        { k:'New members 7d', v: c.new_members_7d, d: 15.4 },
        { k:'Posts', v: MB.fmt.compact(c.posts), d: 6.1 },
        { k:'Messages 7d', v: MB.fmt.compact(c.messages_7d), d: 11.9 },
        { k:'Reports', v: c.reports, tone: c.reports > 4 ? 'danger' : c.reports ? 'warn' : '', d: -4.2 },
        { k:'Visibility', v: c.visibility, spark:false },
        { k:'Status', v: c.status, tone: c.status === 'blocked' ? 'danger' : 'accent', spark:false }
      ]);

      /* ---- overview ---- */
      document.getElementById('paneOverview').innerHTML =
        '<div class="detail-cols">' +
          '<section class="panel"><div class="panel-head"><h2>Growth &amp; activity</h2>' +
            '<span class="t-xs c-3">last 12 weeks</span></div>' +
            '<div class="panel-body">' +
              '<div data-chart="area" data-seed="' + c.id + '" data-h="190"></div>' +
              '<div class="mini-stats" style="margin-top:16px">' +
                '<div><div class="v">' + MB.fmt.compact(c.members) + '</div><div class="k">Members</div></div>' +
                '<div><div class="v">' + MB.fmt.compact(c.posts) + '</div><div class="k">Posts</div></div>' +
                '<div><div class="v">' + MB.fmt.compact(c.messages_7d) + '</div><div class="k">Msgs 7d</div></div>' +
                '<div><div class="v">' + c.online + '</div><div class="k">Online</div></div>' +
              '</div></div></section>' +

          '<section class="panel"><div class="panel-head"><h2>Ownership</h2></div>' +
            '<div class="panel-body"><div class="info-list">' +
              row('Room type', c.kind === 'market' ? 'Market room (pair)' : 'Trader room (personal)') +
              row('Created by', c.kind === 'trader'
                ? '<a class="link" href="user-detail.html?u=' + c.created_by + '">@' + MB.esc(c.created_by) + '</a>'
                : 'System') +
              row('Owner', c.kind === 'trader' ? MB.esc(c.owner_name) : 'KonfluenX') +
              row('Created', MB.fmt.date(c.created_at)) +
              row('Visibility', c.visibility) +
              (c.market ? row('Market', MB.esc(c.market.name), c.market.symbol) : '') +
              (c.market ? row('Category', MB.catLabel(c.category)) : '') +
              row('Status', statusBadge(c.status)) +
            '</div>' +
            (c.kind === 'market'
              ? '<div class="alert alert-info" style="margin-top:16px"><span data-icon="info"></span>' +
                '<div class="t-xs">Market rooms are created automatically, one per tradable pair. ' +
                'They cannot be deleted, only blocked.</div></div>'
              : '<div class="alert alert-warn" style="margin-top:16px"><span data-icon="warning"></span>' +
                '<div class="t-xs">This room is owned by a user. Blocking it hides the room and its ' +
                'content from everyone except staff.</div></div>') +
            '</div></section>' +
        '</div>';

      /* ---- activity ---- */
      document.getElementById('paneActivity').innerHTML =
        '<div class="detail-cols even">' +
          '<section class="panel"><div class="panel-head"><h2>Top contributors</h2></div>' +
            '<div class="panel-body panel-body-flush">' +
              c.top_posters.map(function (t, i) {
                return '<div class="lb-row"><span class="lb-rank' + (i < 3 ? ' r' + (i+1) : '') + '">' +
                  (i+1) + '</span>' + MB.avatar({ username: t.username }, 'avatar-sm') +
                  '<span class="grow"><a class="lb-name" href="user-detail.html?u=' + t.username + '">' +
                    MB.esc(t.username) + '</a></span>' +
                  '<span class="lb-metric">' + t.posts + ' posts</span></div>';
              }).join('') +
            '</div></section>' +
          '<section class="panel"><div class="panel-head"><h2>Message volume</h2></div>' +
            '<div class="panel-body"><div data-chart="candle" data-seed="msg' + c.id + '" data-h="190"></div>' +
            '</div></section>' +
        '</div>';

      /* ---- members ---- */
      var mem = (room.members || users.slice(0, 12).map(function (u, i) {
        return { user: { username: u.username, display_name: u.display_name },
                 role: i === 0 ? 'owner' : i === 1 ? 'moderator' : 'member',
                 joined_at: u.joined_at, can_remove: i !== 0 };
      }));
      document.getElementById('paneMembers').innerHTML =
        '<section class="panel"><div class="panel-head"><h2>Members (' + mem.length + ')</h2>' +
          '<span class="t-xs c-3">staff can remove anyone except the owner</span></div>' +
          '<div class="panel-body panel-body-flush" id="memberList"></div></section>';
      var mh = document.getElementById('memberList');
      mh.innerHTML = mem.map(function (m) {
        var badge = m.role === 'owner' ? '<span class="badge badge-owner">Owner</span>'
                  : m.role === 'moderator' ? '<span class="badge badge-mod">Moderator</span>' : '';
        return '<div class="member-row">' + MB.avatar(m.user, 'avatar-sm') +
          '<span class="grow"><span class="row g2"><a class="mr-n" href="user-detail.html?u=' +
            m.user.username + '">' + MB.esc(m.user.username) + '</a>' + badge + '</span>' +
          '<span class="mr-r">Joined ' + MB.fmt.date(m.joined_at) + '</span></span>' +
          (m.can_remove ? '<button class="btn-remove none" data-rm="' + MB.esc(m.user.username) +
            '">Remove</button>' : '') + '</div>';
      }).join('');
      MB.$$('[data-rm]', mh).forEach(function (b) {
        b.addEventListener('click', function () {
          var n = b.getAttribute('data-rm');
          if (!confirm('Remove ' + n + ' from ' + c.name + '?')) { return; }
          b.closest('.member-row').remove();
          MB.api.del('admin/communities/' + c.id + '/members/' + n);
          MB.toast(n + ' removed');
        });
      });

      /* ---- moderation ---- */
      document.getElementById('paneModeration').innerHTML =
        '<section class="panel"><div class="panel-head"><h2>Moderation</h2></div>' +
          '<div class="panel-body">' +
            '<div class="info-list">' +
              row('Open reports', String(c.reports)) +
              row('Status', statusBadge(c.status)) +
              row('Visibility', c.visibility) +
            '</div>' +
            '<div class="form-actions">' +
              '<button class="btn btn-ghost btn-sm">Pin announcement</button>' +
              '<button class="btn btn-ghost btn-sm">Mute room 24h</button>' +
              '<button class="btn btn-ghost btn-sm">Clear reports</button>' +
              '<button class="btn btn-sell btn-sm" id="btnBlock2">' +
                (c.status === 'blocked' ? 'Unblock room' : 'Block room') + '</button>' +
            '</div></div></section>';

      MB.mountIcons(); MB.mountCharts();

      function toggleBlock() {
        var to = c.status === 'blocked' ? 'active' : 'blocked';
        if (!confirm((to === 'blocked' ? 'Block ' : 'Unblock ') + c.name + '?')) { return; }
        c.status = to;
        MB.api.patch('admin/communities/' + c.id, { status: to });
        MB.toast(c.name + ' ' + to);
        MB.$$('#btnBlock, #btnBlock2').forEach(function (b) {
          b.textContent = to === 'blocked' ? 'Unblock' : 'Block';
        });
      }
      document.getElementById('btnBlock').addEventListener('click', toggleBlock);
      document.getElementById('btnBlock2').addEventListener('click', toggleBlock);
      document.getElementById('btnFlag').addEventListener('click', function () {
        MB.api.post('admin/communities/' + c.id + '/flag');
        MB.toast('Flagged for review');
      });
    });

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b) { return; }
    MB.$$('#tabs button').forEach(function (x) { x.classList.remove('is-active'); });
    b.classList.add('is-active');
    ['overview','activity','members','moderation'].forEach(function (k) {
      document.getElementById('pane' + k.charAt(0).toUpperCase() + k.slice(1))
        .classList.toggle('hide', k !== b.getAttribute('data-t'));
    });
  });
});
</script>
</body>
</html>
