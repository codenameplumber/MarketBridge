<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff &amp; Roles — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="superadmin" data-nav="staff" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>

      <div class="grow">
        <h1>Staff &amp; Roles</h1>
        <div class="sub">Who has access to the staff portals, and what they can do</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-brand btn-sm" id="btnInvite" data-can="staff.invite">
        <span data-icon="plus"></span> Invite staff</button>
    </header>

    <main class="admin-body">

      <!-- Only the owner role can reach this page at all. -->
      <div class="alert alert-warn">
        <span data-icon="warning"></span>
        <div class="t-xs"><strong>Super Admin only.</strong> Everything on this page
        grants or removes another person&rsquo;s access. Changes take effect on their
        next request and are written to the staff audit.</div>
      </div>

      <div id="stats"></div>

      <!-- ================================================================
           WHAT EACH ROLE CAN DO — read straight from the manifest, so this
           can never describe a permission the code does not actually grant.
           ================================================================ -->
      <section class="admin-card">
        <div class="admin-card-head">
          <h2>What each role can do</h2>
          <span class="t-xs c-3">From the role manifest</span>
        </div>
        <div class="role-grid" id="roleGrid"></div>
      </section>

      <div id="table"></div>
    </main>
  </div>
</div>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>
MB.ready(function () {

  var ROLE_TONE = { superadmin: 'brand', admin: 'green', moderator: 'info' };

  function roleBadge(r) {
    return '<span class="role-tag role-' + r + '">' +
      MB.esc(MB.roles.get(r) ? MB.roles.get(r).label : r) + '</span>';
  }
  function statusBadge(s) {
    var cls = { active: 'badge-active', suspended: 'badge-warn',
                disabled: 'badge-lost', invited: 'badge-neutral' }[s] || 'badge-neutral';
    return '<span class="badge ' + cls + '">' + s + '</span>';
  }

  /* ---- the manifest, rendered as a comparison ------------------------- */
  MB.$('#roleGrid').innerHTML = MB.roles.list().map(function (id) {
    var role = MB.roles.get(id);
    var pages = MB.roles.pages(id).filter(function (p) { return !p.group; });
    return '<article class="role-card role-' + id + '">' +
      '<div class="between">' +
        roleBadge(id) +
        '<span class="t-xs c-3">' + role.actions.length + ' permissions</span>' +
      '</div>' +
      '<p class="t-xs c-2 mt3">' + MB.esc(role.blurb) + '</p>' +
      '<div class="t-xs c-3 mt4">Where they work</div>' +
      (role.portal
        ? '<div class="t-xs num">/' + MB.esc(role.home) + '</div>' +
          '<div class="t-xs c-3 mt3">Pages (' + pages.length + ')</div>' +
          '<div class="role-pages">' + pages.map(function (p) {
            return '<span class="role-pill">' + MB.esc(p.label) + '</span>';
          }).join('') + '</div>'
        /* A moderator has no console. Saying so plainly stops anyone
           looking for a /moderator/ folder that must not exist. */
        : '<div class="t-xs">The customer app &mdash; no console</div>' +
          '<div class="t-xs c-3 mt3">Powers in the community</div>' +
          '<div class="role-pages">' +
            ['Enter any room', 'Flag a message', 'Flag a room',
             'Flag a post or signal'].map(function (x) {
              return '<span class="role-pill">' + x + '</span>';
            }).join('') + '</div>') +
    '</article>';
  }).join('');

  /* ---- staff table ---------------------------------------------------- */
  MB.api.get('admin/staff').then(function (r) {
    var rows = r.data;
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function countBy(key, value) {
      return rows.filter(function (x) { return x[key] === value; }).length;
    }

    function paintStats() {
    MB.statSlider('#stats', 'Staff overview', [
      { k: 'Total staff',  v: rows.length,             spark: false },
      { k: 'Active now',   v: countBy('status', 'active'), tone: 'accent', spark: false },
      { k: 'Super Admins', v: countBy('role', 'superadmin'), note: 'full control', spark: false },
      { k: 'Admins',       v: countBy('role', 'admin'), note: 'platform operations', spark: false },
      { k: 'Moderators',   v: countBy('role', 'moderator'), note: 'in-app, no console', spark: false },
      { k: 'Without 2FA',  v: rows.filter(function (x) { return !x.two_factor; }).length,
        tone: 'danger', note: 'should be zero', spark: false }
    ]);
    }
    paintStats();
    drawTable();

    /* The dialogs mutate `rows`, so the table and the counters are drawn
       through one function they can call again. */
    function redraw() { paintStats(); drawTable(); }

    function drawTable() {
    MB.datatable({
      data: rows, into: '#table', perPage: 12, sortKey: 'name', selectable: true,
      searchPlaceholder: 'Search staff by name, username or email…',
      search: ['name', 'username', 'email'],
      columns: [
        { key: 'name', label: 'Person', sortable: true,
          render: function (s) {
            return '<div class="cell-user">' +
              '<span class="avatar avatar-sm">' + MB.fmt.initials(s.name) + '</span>' +
              '<div><div class="n">' + MB.esc(s.name) + '</div>' +
              '<div class="h c-3">' + MB.esc(s.email) + '</div></div></div>';
          } },
        { key: 'role', label: 'Role', sortable: true,
          filter: ['superadmin', 'admin', 'moderator'],
          render: function (s) { return roleBadge(s.role); } },
        { key: 'status', label: 'Status', sortable: true,
          filter: ['active', 'invited', 'suspended', 'disabled'],
          render: function (s) { return statusBadge(s.status); } },
        { key: 'two_factor', label: '2FA', sortable: true,
          render: function (s) {
            return s.two_factor
              ? '<span class="c-up t-xs w-bold">on</span>'
              : '<span class="c-down t-xs w-bold">off</span>';
          } },
        { key: 'actions_30d', label: 'Actions 30d', sortable: true, numeric: true,
          render: function (s) { return s.actions_30d || '<span class="c-3">&mdash;</span>'; } },
        { key: 'location', label: 'Location', sortable: true,
          render: function (s) {
            return '<span class="c-2">' + MB.esc(s.location) + '</span>' +
              '<div class="h c-3 num">' + MB.esc(s.last_ip) + '</div>';
          } },
        { key: 'last_active', label: 'Last active', sortable: true,
          sortValue: function (s) { return s.last_active ? new Date(s.last_active).getTime() : 0; },
          render: function (s) {
            return s.last_active
              ? '<span class="c-3">' + MB.fmt.ago(s.last_active) + '</span>'
              : '<span class="c-3">never</span>';
          } },
        { key: '', label: 'Actions', align: 'right',
          render: function (s) {
            /* The owner account cannot be demoted or removed from here —
               that is the one door this page must not be able to lock. */
            var isOwner = s.role === 'superadmin';
            return '<div class="row-actions">' +
              '<button class="row-action" data-can="staff.edit_role" data-edit="' + s.id +
                '" aria-label="Change role"' + (isOwner ? ' disabled' : '') + '>' +
                MB.icon('edit', 15) + '</button>' +
              '<button class="row-action is-reject" data-can="staff.disable" data-disable="' + s.id +
                '" aria-label="Disable"' + (isOwner ? ' disabled' : '') + '>' +
                MB.icon('ban', 15) + '</button>' +
            '</div>';
          } }
      ],
      done: function () { wireRowActions(); }
    });
    }

    /* ------------------------------------------------------------------
       Every action on this page opens a dialog. Granting or removing
       someone's access is not a thing to do on a single stray click.
       ------------------------------------------------------------------ */

    var ROLE_INFO = {
      moderator: {
        t: 'Moderator',
        d: 'A regular user with elevated reach in the community. Enters any ' +
           'room, flags messages and rooms for review. No console.'
      },
      admin: {
        t: 'Admin',
        d: 'Runs the platform: people, content, money and markets. Acts on ' +
           'what moderators raise. No staff management or settings.'
      },
      superadmin: {
        t: 'Super Admin',
        d: 'Full control, including agents, other staff and platform settings.'
      }
    };

    function rolePicker(current, exclude) {
      return '<div class="role-pick">' +
        MB.roles.list().filter(function (r) { return r !== exclude; })
          .map(function (r) {
            return '<button type="button" data-role-opt="' + r + '"' +
              (r === current ? ' class="is-active"' : '') + '>' +
              '<span class="role-tag role-' + r + '">' + MB.esc(ROLE_INFO[r].t) + '</span>' +
              '<span class="grow"><span class="rp-t">' + MB.esc(ROLE_INFO[r].t) + '</span>' +
              '<span class="rp-d">' + MB.esc(ROLE_INFO[r].d) + '</span></span></button>';
          }).join('') + '</div>';
    }

    function wireRolePicker(m, onPick) {
      m.$$('[data-role-opt]').forEach(function (b) {
        b.addEventListener('click', function () {
          m.$$('[data-role-opt]').forEach(function (x) { x.classList.remove('is-active'); });
          b.classList.add('is-active');
          onPick(b.getAttribute('data-role-opt'));
        });
      });
    }

    /* ---- EDIT: change someone's role ---------------------------------- */
    function openEdit(st) {
      var picked = st.role;
      MB.modal({
        title: 'Change role',
        sub: st.name + ' · ' + st.email,
        wide: true,
        body:
          '<div class="alert alert-warn mb4">' +
            '<span data-icon="warning"></span>' +
            '<div class="t-xs">This changes what they can reach on their next ' +
            'request, and is written to the staff audit.</div>' +
          '</div>' +
          rolePicker(st.role),
        actions: [
          { label: 'Cancel', kind: 'ghost', close: true },
          { label: 'Save role', kind: 'brand', onClick: function (m) {
              if (picked === st.role) { m.close(); return; }
              st.role = picked;
              MB.api.patch('staff/' + st.id, { role: picked });
              m.close();
              redraw();
              MB.toast(st.name + ' is now ' + ROLE_INFO[picked].t, 'ok');
            } }
        ],
        onOpen: function (root, m) {
          m.setAction(1, { disabled: true });
          wireRolePicker(m, function (r) {
            picked = r;
            m.setAction(1, { disabled: r === st.role });
          });
        }
      });
    }

    /* ---- BLOCK / RESTORE ---------------------------------------------- */
    function openBlock(st) {
      var blocked = st.status === 'disabled' || st.status === 'suspended';

      if (blocked) {
        MB.modal({
          title: 'Restore access',
          sub: st.name + ' · currently ' + st.status,
          body: '<p class="t-sm c-2">They regain the ' + MB.esc(st.role) +
                ' permissions they had before. Nothing else changes.</p>',
          actions: [
            { label: 'Cancel', kind: 'ghost', close: true },
            { label: 'Restore access', kind: 'trade', onClick: function (m) {
                st.status = 'active';
                MB.api.patch('staff/' + st.id, { status: 'active' });
                m.close(); redraw();
                MB.toast(st.name + ' restored', 'ok');
              } }
          ]
        });
        return;
      }

      var reason = 'policy';
      MB.modal({
        title: 'Block ' + st.name + '?',
        sub: st.email,
        body:
          '<div class="alert alert-warn mb4">' +
            '<span data-icon="warning"></span>' +
            '<div class="t-xs">They lose access immediately. Everything they ' +
            'already did stays in the staff audit &mdash; blocking hides nothing.</div>' +
          '</div>' +
          '<div class="label">Reason</div>' +
          '<div class="chips mt2" data-group id="blockReason">' +
            '<button class="chip is-active" data-value="policy">Policy breach</button>' +
            '<button class="chip" data-value="inactive">No longer active</button>' +
            '<button class="chip" data-value="security">Security concern</button>' +
            '<button class="chip" data-value="left">Left the team</button>' +
          '</div>' +
          '<div class="label mt4">Note <span class="c-3">(optional)</span></div>' +
          '<textarea class="input mt2" id="blockNote" rows="3" ' +
            'placeholder="What happened? This is stored with the audit entry."></textarea>',
        actions: [
          { label: 'Cancel', kind: 'ghost', close: true },
          { label: 'Block access', kind: 'sell', onClick: function (m) {
              st.status = 'disabled';
              MB.api.patch('staff/' + st.id, {
                status: 'disabled', reason: reason,
                note: (m.$('#blockNote').value || '').trim()
              });
              m.close(); redraw();
              MB.toast(st.name + ' blocked', 'ok');
            } }
        ],
        onOpen: function (root, m) {
          m.$('#blockReason').addEventListener('mb:change', function (e) {
            reason = e.detail.value;
          });
        }
      });
    }

    /* ---- INVITE: a brand-new admin, or elevate someone who already exists */
    function openInvite() {
      var mode = 'new';                /* 'new' | 'existing' */
      var newRole = 'admin';
      var picked = null;               /* the existing user chosen */

      MB.modal({
        title: 'Add staff',
        sub: 'Register a new admin, or raise someone who already has an account',
        wide: true,
        body:
          '<div class="modal-switch" id="inviteMode">' +
            '<button type="button" class="is-active" data-mode="new">' +
              '<span class="ms-t">Register new admin</span>' +
              '<span class="ms-d">Creates a staff account and emails a one-time ' +
              'set-up link</span></button>' +
            '<button type="button" data-mode="existing">' +
              '<span class="ms-t">Elevate a user</span>' +
              '<span class="ms-d">Find an existing member by email and make them ' +
              'a moderator</span></button>' +
          '</div>' +

          '<div id="paneNew">' +
            '<div class="form-grid cols-2">' +
              '<div class="field"><label for="inName">Full name</label>' +
                '<input class="input" id="inName" placeholder="e.g. Marcus Bell"></div>' +
              '<div class="field"><label for="inEmail">Work email</label>' +
                '<input class="input" id="inEmail" type="email" ' +
                  'placeholder="name@vybe.trade"></div>' +
            '</div>' +
            '<div class="label mt4">Role</div>' +
            '<div class="mt2">' + rolePicker('admin', 'moderator') + '</div>' +
            '<div class="alert alert-info mt4">' +
              '<span data-icon="info"></span>' +
              '<div class="t-xs">They set their own password from the emailed link, ' +
              'and two-factor is required before the console opens.</div>' +
            '</div>' +
          '</div>' +

          '<div id="paneExisting" class="hide">' +
            '<div class="field"><label for="inSearch">Search by email or username</label>' +
              '<span class="input-icon"><span data-icon="search"></span>' +
              '<input class="input" id="inSearch" type="search" ' +
                'placeholder="name@example.com"></span></div>' +
            '<div id="inResults" class="mt3"></div>' +
            '<div class="alert alert-info mt4">' +
              '<span data-icon="info"></span>' +
              '<div class="t-xs">A moderator keeps their normal account and the ' +
              'whole customer app. They gain entry to every room and the ability ' +
              'to flag &mdash; nothing destructive.</div>' +
            '</div>' +
          '</div>',
        actions: [
          { label: 'Cancel', kind: 'ghost', close: true },
          { label: 'Send invite', kind: 'brand', onClick: function (mm) {
              if (mode === 'new') { submitNew(mm); } else { submitElevate(mm); }
            } }
        ],
        onOpen: function (root, mm) { wireInvite(mm); }
      });

      function refreshAction(mm) {
        if (mode === 'new') {
          var ok = mm.$('#inName').value.trim().length > 1 &&
                   EMAIL_RE.test(mm.$('#inEmail').value.trim());
          mm.setAction(1, { disabled: !ok, label: 'Send invite' });
        } else {
          mm.setAction(1, { disabled: !picked, label: 'Make moderator' });
        }
      }

      function wireInvite(mm) {
        mm.$('#inviteMode').addEventListener('click', function (e) {
          var b = e.target.closest('[data-mode]');
          if (!b) { return; }
          mode = b.getAttribute('data-mode');
          mm.$$('[data-mode]').forEach(function (x) {
            x.classList.toggle('is-active', x === b);
          });
          mm.$('#paneNew').classList.toggle('hide', mode !== 'new');
          mm.$('#paneExisting').classList.toggle('hide', mode !== 'existing');
          refreshAction(mm);
        });

        wireRolePicker(mm, function (r) { newRole = r; });
        ['#inName', '#inEmail'].forEach(function (sel) {
          mm.$(sel).addEventListener('input', function () { refreshAction(mm); });
        });

        var t;
        mm.$('#inSearch').addEventListener('input', function () {
          clearTimeout(t);
          var q = this.value.trim().toLowerCase();
          picked = null;
          refreshAction(mm);
          t = setTimeout(function () { searchUsers(mm, q); }, 200);
        });

        refreshAction(mm);
      }

      /* Searches the real member list. Someone who is already a moderator is
         shown but cannot be picked again. */
      function searchUsers(mm, q) {
        var host = mm.$('#inResults');
        if (q.length < 2) { host.innerHTML = ''; return; }

        MB.api.list('admin/users').then(function (users) {
          var hits = users.filter(function (u) {
            return (u.email || '').toLowerCase().indexOf(q) > -1 ||
                   (u.username || '').toLowerCase().indexOf(q) > -1;
          }).slice(0, 6);

          if (!hits.length) {
            host.innerHTML = '<p class="t-xs c-3">No member matches that. ' +
              'They need an account before they can be elevated.</p>';
            return;
          }

          host.innerHTML = hits.map(function (u) {
            var already = u.role === 'moderator';
            return '<button type="button" class="user-hit" data-pick="' +
              MB.esc(u.username) + '"' + (already ? ' disabled' : '') + '>' +
              '<span class="avatar avatar-sm">' + MB.fmt.initials(u.display_name) + '</span>' +
              '<span class="grow" style="min-width:0">' +
                '<span class="uh-n">' + MB.esc(u.display_name) + '</span>' +
                '<span class="uh-e">' + MB.esc(u.email) + '</span></span>' +
              (already
                ? '<span class="role-tag role-moderator">Already a moderator</span>'
                : '<span class="c-3">' + MB.icon('plus', 16) + '</span>') +
            '</button>';
          }).join('');
          MB.mountIcons(host);

          MB.$$('[data-pick]', host).forEach(function (b) {
            b.addEventListener('click', function () {
              MB.$$('[data-pick]', host).forEach(function (x) {
                x.classList.remove('is-picked');
              });
              b.classList.add('is-picked');
              picked = hits.filter(function (u) {
                return u.username === b.getAttribute('data-pick');
              })[0];
              refreshAction(mm);
            });
          });
        });
      }

      function submitNew(mm) {
        var payload = {
          name: mm.$('#inName').value.trim(),
          email: mm.$('#inEmail').value.trim(),
          role: newRole
        };
        MB.api.post('staff/invite', payload);
        rows.push({
          id: 'stf_new_' + Date.now(), name: payload.name,
          username: payload.email.split('@')[0], email: payload.email,
          role: payload.role, status: 'invited', location: '—',
          two_factor: false, actions_30d: 0, last_active: null,
          last_ip: '—', invited_by: 'You'
        });
        mm.close(); redraw();
        MB.toast('Invite sent to ' + payload.email, 'ok');
      }

      function submitElevate(mm) {
        if (!picked) { return; }
        MB.api.post('staff/elevate', {
          username: picked.username, email: picked.email, role: 'moderator'
        });
        rows.push({
          id: 'stf_up_' + picked.username, name: picked.display_name,
          username: picked.username, email: picked.email,
          role: 'moderator', status: 'active', location: '—',
          two_factor: !!picked.is_verified, actions_30d: 0,
          last_active: picked.last_seen_at, last_ip: '—', invited_by: 'You'
        });
        mm.close(); redraw();
        MB.toast(picked.display_name + ' is now a moderator', 'ok');
      }
    }

    function wireRowActions() {
      MB.$$('[data-edit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var st = byId(b.getAttribute('data-edit'));
          if (st) { openEdit(st); }
        });
      });
      MB.$$('[data-disable]').forEach(function (b) {
        b.addEventListener('click', function () {
          var st = byId(b.getAttribute('data-disable'));
          if (st) { openBlock(st); }
        });
      });
    }

    function byId(id) {
      return rows.filter(function (x) { return x.id === id; })[0];
    }

    var invite = MB.$('#btnInvite');
    if (invite) { invite.addEventListener('click', openInvite); }
  });
});
</script>
</body>
</html>
