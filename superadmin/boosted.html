<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boosted Signals — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="superadmin" data-nav="boosted" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Boosted Signals</h1>
        <div class="sub" id="pageSub">Give selected community signals extra visibility</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-primary btn-sm none" id="btnBoostNew" data-can="boost.create"><span data-icon="megaphone"></span> Boost a signal</button>
    </header>
    <main class="admin-body">
      <div class="alert alert-info">
        <span data-icon="info"></span>
        <div class="t-sm"><strong>A boost is visibility only.</strong> It is time-boxed,
        labelled on the signal, and must never be presented as KonfluenX endorsing
        or guaranteeing the trade.</div>
      </div>
      <div id="stats"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  MB.api.list('signals').then(function (all) {
    /* A boost record is derived from the signal it promotes, so the two can
       never drift apart. */
    var PLACES = ['home_feed','signals_top','market_page'];
    var rows = all.filter(function (s) { return s.boost && s.boost.is_boosted; })
      .concat(all.slice(0, 18))
      .filter(function (v, i, a) { return a.indexOf(v) === i; })
      .slice(0, 24)
      .map(function (s, i) {
        var expired = i % 4 === 3;
        return {
          id: 'b_' + s.id, signal_id: s.id, signal: (s.direction||'').toUpperCase() + ' ' + s.market.short_name,
          body: s.body, provider: s.author.username, market: s.market.short_name,
          category: s.market.category, placement: PLACES[i % PLACES.length],
          impressions: 400 + i * 733, clicks: 30 + i * 41,
          boosted_at: s.published_at,
          expires_at: new Date(Date.now() + (expired ? -1 : 1) * (2 + i) * 86400000).toISOString(),
          status: expired ? 'expired' : 'active'
        };
      });

    var active = rows.filter(function (b) { return b.status === 'active'; }).length;
    var imp = rows.reduce(function (a, b) { return a + b.impressions; }, 0);
    var clk = rows.reduce(function (a, b) { return a + b.clicks; }, 0);

    MB.statSlider('#stats', 'Boosts', [
      { k:'Total boosts', v: rows.length, d: 8.4 },
      { k:'Active', v: active, tone:'accent', spark:false },
      { k:'Expired', v: rows.length - active, spark:false },
      { k:'Impressions', v: MB.fmt.compact(imp), d: 18.2 },
      { k:'Clicks', v: MB.fmt.compact(clk), d: 12.6 },
      { k:'Click-through', v: imp ? (clk / imp * 100).toFixed(1) + '%' : '—', d: 1.4 }
    ]);

    MB.datatable({
      data: rows, into: '#table', perPage: 12, selectable: true,
      sortKey: 'boosted_at', sortDir: 'desc',
      searchPlaceholder: 'Search boosted signals…', search: ['signal','provider','market'],
      columns: [
        { key:'signal', label:'Signal', sortable:true,
          render: function (b) {
            return '<a class="cell-link" href="signal-detail.html?id=' + b.signal_id + '">' +
              '<div><div class="n">' + MB.esc(b.signal) + '</div>' +
              '<div class="h c-3 truncate" style="max-width:220px">' + MB.esc(b.body) + '</div></div></a>'; } },
        { key:'provider', label:'Provider', sortable:true,
          render: function (b) { return userCell(b.provider, null, 'user-detail.html?u=' + b.provider); } },
        { key:'category', label:'Category', sortable:true,
          filter:['synthetic_indices','derived','forex','crypto','commodities','stock_indices'],
          render: function (b) { return '<span class="c-2">' + MB.catLabel(b.category) + '</span>'; } },
        { key:'placement', label:'Placement', sortable:true, filter:['home_feed','signals_top','market_page'],
          render: function (b) { return '<span class="c-2">' + b.placement.replace(/_/g,' ') + '</span>'; } },
        { key:'impressions', label:'Impressions', sortable:true, numeric:true,
          render: function (b) { return MB.fmt.compact(b.impressions); } },
        { key:'clicks', label:'CTR', sortable:true, numeric:true,
          sortValue: function (b) { return b.clicks / b.impressions; },
          render: function (b) { return (b.clicks / b.impressions * 100).toFixed(1) + '%'; } },
        { key:'expires_at', label:'Expires', sortable:true,
          sortValue: function (b) { return new Date(b.expires_at).getTime(); },
          render: function (b) { return '<span class="c-3">' + MB.fmt.date(b.expires_at) + '</span>'; } },
        { key:'status', label:'Status', sortable:true, filter:['active','expired'],
          render: function (b) { return statusBadge(b.status); } },
        { key:'', label:'Actions', align:'right',
          render: function (b) { return acts(
            '<a class="row-action" href="signal-detail.html?id=' + b.signal_id + '" aria-label="Open">' +
              MB.icon('eye', 15) + '</a>' +
            '<button class="row-action is-reject" aria-label="Revoke">' + MB.icon('close', 15) + '</button>'); } }
      ]
    });
  });
});
</script>
</body>
</html>
