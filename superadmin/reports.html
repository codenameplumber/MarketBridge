<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports & Moderation — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="superadmin" data-nav="reports" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Reports & Moderation</h1>
        <div class="sub" id="pageSub">Handle reported signals, posts, comments, rooms and accounts</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      
    </header>
    <main class="admin-body">
      
      <div id="stats"></div>
      <div id="bulk"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  MB.api.get('admin/reports').then(function (res) {
    var rows = res.data, m = res.meta;

    MB.statSlider('#stats', 'Moderation queue', [
      { k:'Open reports', v: m.pending, tone: m.pending ? 'warn' : '', d: -6.2 },
      { k:'Under review', v: m.under_review, spark:false },
      { k:'High priority', v: m.high_priority, tone: m.high_priority ? 'danger' : '', spark:false },
      { k:'Total (all time)', v: m.total, d: 4.8 },
      { k:'Resolved', v: rows.filter(function (r) { return r.status === 'resolved'; }).length, d: 9.1 },
      { k:'Rejected', v: rows.filter(function (r) { return r.status === 'rejected'; }).length, d: -1.2 }
    ]);

    var dt = MB.datatable({
      data: rows, into: '#table', perPage: 15, selectable: true,
      sortKey: 'created_at', sortDir: 'desc',
      searchPlaceholder: 'Search reports, users or content…',
      search: ['reason','excerpt','reported_user','reported_by'],
      columns: [
        { key:'priority', label:'!', sortable:true, filter:['high','medium','low'],
          render: function (r) {
            var c = { high:'badge-lost', medium:'badge-warn', low:'badge-neutral' }[r.priority];
            return '<span class="badge ' + c + '">' + r.priority + '</span>'; } },
        { key:'reason', label:'Reason', sortable:true,
          filter:['inappropriate','spam_misleading','hate_harassment','scam_fraud','violence_threats','other'],
          render: function (r) {
            return '<div><div class="n">' + r.reason.replace(/_/g,' ') + '</div>' +
              '<div class="h c-3 truncate" style="max-width:250px">' + MB.esc(r.excerpt) + '</div></div>'; } },
        { key:'target_type', label:'Target', sortable:true,
          filter:['post','comment','signal','profile','room','message'],
          render: function (r) {
            return '<span class="c-2">' + r.target_type + '</span>' +
              (r.room ? '<div class="h c-3 truncate">' + MB.esc(r.room) + '</div>' : '');
          } },
        { key:'reported_user', label:'Reported user', sortable:true,
          render: function (r) { return userCell(r.reported_user, null, 'user-detail.html?u=' + r.reported_user); } },
        { key:'reported_by', label:'Raised by', sortable:true,
          render: function (r) {
            /* A moderator flag carries more weight than a random report —
               it comes from someone the platform trusts to watch rooms. */
            return '<span class="c-2">@' + MB.esc(r.reported_by) + '</span>' +
              (r.source === 'moderator'
                ? '<div class="h"><span class="role-tag role-moderator">Moderator</span></div>'
                : '');
          } },
        { key:'source', label:'Source', sortable:true, filter:['moderator','user'],
          render: function (r) {
            return r.source === 'moderator'
              ? '<span class="badge badge-info">moderator</span>'
              : '<span class="c-3">user report</span>';
          } },
        { key:'status', label:'Status', sortable:true, filter:['pending','under_review','resolved','rejected'],
          render: function (r) { return statusBadge(r.status); } },
        { key:'created_at', label:'When', sortable:true,
          sortValue: function (r) { return new Date(r.created_at).getTime(); },
          render: function (r) { return '<span class="c-3">' + MB.fmt.ago(r.created_at) + '</span>'; } },
        { key:'', label:'Actions', align:'right',
          render: function (r) { return acts(
            '<button class="row-action" data-view="' + r.id + '" aria-label="Review">' + MB.icon('eye', 15) + '</button>' +
            '<button class="row-action is-approve" data-can="report.review" data-act="resolve:' + r.id + '" aria-label="Resolve">' +
              MB.icon('check', 15) + '</button>' +
            '<button class="row-action is-reject" data-can="report.dismiss" data-act="reject:' + r.id + '" aria-label="Dismiss">' +
              MB.icon('close', 15) + '</button>'); } }
      ],
      done: function () { wire(rows); }
    });

    document.getElementById('bulk').innerHTML =
      '<div class="bulk-bar"><span class="bb-t">Bulk actions</span>' +
        '<button class="btn btn-ghost btn-sm" data-can="report.review" data-bulk="resolve">' +
          MB.icon('check', 15) + ' Resolve selected</button>' +
        '<button class="btn btn-ghost btn-sm" data-can="user.warn" data-bulk="warn">' +
          MB.icon('warning', 15) + ' Warn users</button>' +
        '<button class="btn btn-ghost btn-sm" data-can="post.remove" data-bulk="remove">' +
          MB.icon('trash', 15) + ' Remove content</button>' +
        /* Suspending is an operator power — a moderator escalates instead. */
        '<button class="btn btn-sell btn-sm" data-can="user.suspend" data-bulk="ban">' +
          MB.icon('ban', 15) + ' Suspend users</button>' +
        '<button class="btn btn-ghost btn-sm" data-can="report.escalate" data-bulk="escalate">' +
          MB.icon('flag', 15) + ' Escalate to admin</button>' +
      '</div>';
    MB.mountIcons(document.getElementById('bulk'));
    if (MB.applyPermissions) { MB.applyPermissions(document.getElementById('bulk')); }
    MB.$$('[data-bulk]').forEach(function (b) {
      b.addEventListener('click', function () {
        var n = dt.selected().length;
        if (!n) { MB.toast('Select some rows first', 'err'); return; }
        MB.toast(b.getAttribute('data-bulk') + ' applied to ' + n + ' report' + (n === 1 ? '' : 's'));
      });
    });

    function wire(all) {
      MB.$$('[data-view]').forEach(function (b) {
        b.addEventListener('click', function () {
          var r = all.filter(function (x) { return x.id === b.getAttribute('data-view'); })[0];
          openSO('Report ' + r.id,
            '<div class="alert alert-warn"><span data-icon="warning"></span>' +
              '<div class="t-sm"><strong>' + r.reason.replace(/_/g,' ') + '</strong> · ' +
              r.priority + ' priority</div></div>' +
            '<section class="panel"><div class="panel-head"><h3>Reported content</h3></div>' +
              '<div class="panel-body"><p class="t-sm">' + MB.esc(r.excerpt) + '</p>' +
              (r.details ? '<p class="t-xs c-3" style="margin-top:8px">Reporter note: ' +
                MB.esc(r.details) + '</p>' : '') + '</div></section>' +
            '<section class="panel"><div class="panel-body"><div class="info-list">' +
              row('Target type', r.target_type) +
              row('Target ID', '<code>' + r.target_id + '</code>') +
              row('Reported user', '<a class="link" href="user-detail.html?u=' + r.reported_user + '">@' +
                MB.esc(r.reported_user) + '</a>') +
              row('Reported by', '@' + MB.esc(r.reported_by)) +
              row('Status', statusBadge(r.status)) +
              row('Received', MB.fmt.date(r.created_at)) +
              (r.handled_by ? row('Handled by', MB.esc(r.handled_by)) : '') +
              (r.resolution ? row('Resolution', r.resolution.replace(/_/g,' ')) : '') +
            '</div></div></section>' +
            '<div class="stack g2">' +
              '<button class="btn btn-primary btn-block" data-so="resolve">Remove content &amp; resolve</button>' +
              '<button class="btn btn-ghost btn-block" data-so="warn">Warn the user</button>' +
              '<button class="btn btn-ghost btn-block" data-so="suspend">Suspend user 7 days</button>' +
              '<button class="btn btn-sell btn-block" data-so="ban">Ban user</button>' +
              '<button class="btn btn-outline btn-block" data-so="reject">Dismiss report</button>' +
            '</div>');
          MB.$$('[data-so]').forEach(function (x) {
            x.addEventListener('click', function () {
              MB.api.patch('admin/reports/' + r.id, { action: x.getAttribute('data-so') });
              MB.toast('Report ' + r.id + ' — ' + x.getAttribute('data-so'));
              closeSO();
            });
          });
        });
      });
      MB.$$('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var p = b.getAttribute('data-act').split(':');
          MB.api.patch('admin/reports/' + p[1], { action: p[0] });
          MB.toast('Report ' + p[1] + ' ' + (p[0] === 'resolve' ? 'resolved' : 'dismissed'));
        });
      });
    }
  });
});
</script>
</body>
</html>
