<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="admin" data-nav="resources" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      <a class="icon-btn none" href="resources.html" aria-label="Back"><span data-icon="back"></span></a>
      <div class="grow">
        <h1 id="pageTitle">Resource</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-ghost btn-sm none" id="btnPreview"><span data-icon="eye"></span> Preview</button>
      <button class="btn btn-primary btn-sm none" id="btnSave"><span data-icon="check"></span> Save</button>
    </header>
    <main class="admin-body">
      
      <div id="stats"></div>

      <div class="admin-tabs" id="tabs">
        <button class="is-active" data-t="details">Details</button>
        <button data-t="pricing">Pricing &amp; access</button>
        <button data-t="curriculum">Curriculum</button>
        <button data-t="media">Media &amp; files</button>
      </div>

      <div id="paneDetails"></div>
      <div id="panePricing" class="hide"></div>
      <div id="paneCurriculum" class="hide"></div>
      <div id="paneMedia" class="hide"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  var id = new URLSearchParams(location.search).get('id');
  var r = null, access = 'free', curriculum = [];

  MB.api.list('admin/resources').then(function (rows) {
    r = id ? (rows.filter(function (x) { return x.id === id; })[0] || rows[0]) : blank();
    access = r.access;
    curriculum = (r.curriculum || []).slice();

    document.getElementById('pageTitle').textContent = id ? r.title : 'New resource';
    document.getElementById('pageSub').textContent = id
      ? r.type + ' · ' + r.access + ' · ' + r.status
      : 'Create a course, guide, video, webinar or mentorship session';

    if (id) {
      MB.statSlider('#stats', 'Performance', [
        { k:'Enrolled', v: MB.fmt.compact(r.enrolled), d: 11.4 },
        { k:'Completions', v: MB.fmt.compact(r.completions), d: 7.2 },
        { k:'Completion rate', v: r.enrolled ? Math.round(r.completions / r.enrolled * 100) + '%' : '—', d: 2.1 },
        { k:'Rating', v: r.rating + ' / 5', spark:false },
        { k:'Revenue', v: r.revenue ? MB.fmt.money(r.revenue, null, 0) : 'Free',
          tone: r.revenue ? 'accent' : '', d: r.revenue ? 16.8 : undefined },
        { k:'Lessons', v: r.lessons, spark:false },
        { k:'Status', v: r.status, tone: r.status === 'published' ? 'accent' : 'warn', spark:false }
      ]);
    }

    renderDetails(); renderPricing(); renderCurriculum(); renderMedia();
    MB.mountIcons(); MB.mountCharts();
  });

  function blank() {
    return { id:null, title:'', summary:'', type:'course', level:'beginner', status:'draft',
             access:'free', price:0, currency:'USD', lessons:0, enrolled:0, completions:0,
             rating:0, revenue:0, author:'', market:null, has_certificate:true, curriculum:[] };
  }

  /* ---- details ---- */
  function renderDetails() {
    document.getElementById('paneDetails').innerHTML =
      '<div class="detail-cols">' +
        '<section class="panel"><div class="panel-head"><h2>Details</h2></div>' +
          '<div class="panel-body"><div class="form-grid cols-2">' +
            '<div class="field full"><label for="eTitle">Title</label>' +
              '<input class="input" id="eTitle" value="' + MB.esc(r.title) + '" placeholder="Smart Money Concepts"></div>' +
            '<div class="field full"><label for="eSummary">Summary</label>' +
              '<textarea class="textarea" id="eSummary" style="min-height:90px">' +
              MB.esc(r.summary) + '</textarea></div>' +
            '<div class="field"><label for="eType">Type</label><select class="select" id="eType">' +
              ['course','pdf','video','webinar','mentorship'].map(function (t) {
                return '<option' + (r.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
              '</select></div>' +
            '<div class="field"><label for="eLevel">Level</label><select class="select" id="eLevel">' +
              ['beginner','intermediate','advanced'].map(function (t) {
                return '<option' + (r.level === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
              '</select></div>' +
            '<div class="field"><label for="eStatus">Status</label><select class="select" id="eStatus">' +
              ['draft','published','scheduled','archived'].map(function (t) {
                return '<option' + (r.status === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
              '</select></div>' +
            '<div class="field"><label for="eMarket">Linked market (optional)</label>' +
              '<select class="select" id="eMarket"><option value="">No market</option></select></div>' +
          '</div>' +
          '<label class="check" style="margin-top:16px"><input type="checkbox" id="eCert"' +
            (r.has_certificate ? ' checked' : '') + '><span class="box">' + MB.icon('check', 13) +
            '</span><span class="c-2">Issue a certificate on completion</span></label>' +
          '</div></section>' +

        '<section class="panel"><div class="panel-head"><h2>Cover image</h2></div>' +
          '<div class="panel-body">' +
            '<div class="drop-zone" id="coverDrop">' +
              MB.icon('image', 26) +
              '<div class="dz-t">Drop a cover image</div>' +
              '<div class="dz-s">16:9, PNG or JPG, up to 12 MB</div>' +
              '<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-pick="coverFile">Browse</button>' +
              '<div class="composer-previews" id="coverPreviews" style="justify-content:center;padding-top:12px"></div>' +
            '</div>' +
            '<input type="file" id="coverFile" accept="image/*" hidden>' +
          '</div></section>' +
      '</div>';

    MB.mountIcons(document.getElementById('paneDetails'));
    MB.uploads.attach({ drop:'#coverDrop', input:'#coverFile', previews:'#coverPreviews', accept:'image' });

    MB.api.list('markets').then(function (ms) {
      var sel = document.getElementById('eMarket');
      sel.innerHTML += ms.map(function (m) {
        return '<option value="' + m.symbol + '"' + (r.market === m.symbol ? ' selected' : '') + '>' +
          m.name + '</option>'; }).join('');
    });
  }

  /* ---- pricing ---- */
  function renderPricing() {
    document.getElementById('panePricing').innerHTML =
      '<div class="detail-cols">' +
        '<section class="panel"><div class="panel-head"><h2>Access</h2></div>' +
          '<div class="panel-body">' +
            '<div class="price-toggle" id="accessToggle">' +
              '<button data-a="free" class="' + (access === 'free' ? 'is-active' : '') + '">' +
                '<div class="pt-t">Free</div>' +
                '<div class="pt-d">Anyone with an account can take it</div></button>' +
              '<button data-a="paid" class="' + (access === 'paid' ? 'is-active' : '') + '">' +
                '<div class="pt-t">Paid</div>' +
                '<div class="pt-d">Requires a one-off purchase</div></button>' +
            '</div>' +
            '<div id="priceFields" class="' + (access === 'paid' ? '' : 'hide') + '" style="margin-top:20px">' +
              '<div class="form-grid cols-2">' +
                '<div class="field"><label for="ePrice">Price</label>' +
                  '<input class="input num" id="ePrice" type="number" min="0" step="1" value="' +
                  (r.price || 0) + '"></div>' +
                '<div class="field"><label for="eCurrency">Currency</label>' +
                  '<select class="select" id="eCurrency"><option>USD</option><option>NGN</option>' +
                  '<option>GBP</option><option>EUR</option></select></div>' +
              '</div>' +
              '<div class="alert alert-info" style="margin-top:16px"><span data-icon="info"></span>' +
                '<div class="t-xs">Payments for paid resources are handled by the same ' +
                'external providers as deposits. KonfluenX records the entitlement, ' +
                'never the money.</div></div>' +
            '</div>' +
          '</div></section>' +

        '<section class="panel"><div class="panel-head"><h2>Revenue</h2></div>' +
          '<div class="panel-body">' +
            '<div class="mini-stats" style="margin:-16px -16px 16px">' +
              '<div><div class="v num">' + (r.revenue ? MB.fmt.money(r.revenue, null, 0) : '—') +
                '</div><div class="k">Revenue</div></div>' +
              '<div><div class="v">' + MB.fmt.compact(r.enrolled) + '</div><div class="k">Enrolled</div></div>' +
              '<div><div class="v">' + MB.fmt.compact(r.completions) + '</div><div class="k">Completed</div></div>' +
            '</div>' +
            '<div data-chart="area" data-seed="rev' + (r.id || 'new') + '" data-h="150"></div>' +
          '</div></section>' +
      '</div>';

    MB.mountIcons(document.getElementById('panePricing'));
    MB.mountCharts(document.getElementById('panePricing'));
    document.getElementById('accessToggle').addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) { return; }
      access = b.getAttribute('data-a');
      MB.$$('#accessToggle button').forEach(function (x) { x.classList.remove('is-active'); });
      b.classList.add('is-active');
      document.getElementById('priceFields').classList.toggle('hide', access !== 'paid');
    });
  }

  /* ---- curriculum ---- */
  function renderCurriculum() {
    var host = document.getElementById('paneCurriculum');
    host.innerHTML =
      '<section class="panel"><div class="panel-head"><h2>Curriculum (' + curriculum.length + ' lessons)</h2>' +
        '<button class="btn btn-primary btn-sm" id="addLesson">' + MB.icon('plus', 15) + ' Add lesson</button></div>' +
        '<div class="panel-body panel-body-flush" id="lessonList"></div>' +
      '</section>';
    paintLessons();
    MB.mountIcons(host);
    document.getElementById('addLesson').addEventListener('click', function () {
      curriculum.push({ order: curriculum.length + 1, title: 'New lesson',
                        duration_seconds: 300, is_preview: false, status: 'draft' });
      renderCurriculum();
    });
  }

  function paintLessons() {
    var list = document.getElementById('lessonList');
    if (!curriculum.length) {
      list.innerHTML = '<div class="empty" style="padding:40px">' + MB.icon('book', 40) +
        '<h3>No lessons yet</h3><p>Add the first lesson to build the curriculum.</p></div>';
      MB.mountIcons(list);
      return;
    }
    list.innerHTML = curriculum.map(function (l, i) {
      return '<div class="lesson-row">' +
        '<span class="grip">' + MB.icon('more', 15) + '</span>' +
        '<span class="ln-n">' + (i + 1) + '</span>' +
        '<span class="grow" style="min-width:0">' +
          '<input class="input" data-lt="' + i + '" value="' + MB.esc(l.title) +
            '" style="height:34px;font-size:13px;background:transparent;border-color:transparent">' +
          '<span class="ln-m" style="padding-left:12px">' + MB.fmt.duration(l.duration_seconds) +
            (l.is_preview ? ' · free preview' : '') + '</span>' +
        '</span>' +
        '<span class="none">' + statusBadge(l.status) + '</span>' +
        '<button class="row-action is-reject none" data-ld="' + i + '" aria-label="Delete lesson">' +
          MB.icon('trash', 15) + '</button>' +
      '</div>';
    }).join('');
    MB.mountIcons(list);
    MB.$$('[data-ld]', list).forEach(function (b) {
      b.addEventListener('click', function () {
        curriculum.splice(Number(b.getAttribute('data-ld')), 1);
        renderCurriculum();
      });
    });
    MB.$$('[data-lt]', list).forEach(function (inp) {
      inp.addEventListener('input', function () {
        curriculum[Number(inp.getAttribute('data-lt'))].title = inp.value;
      });
    });
  }

  /* ---- media ---- */
  function renderMedia() {
    document.getElementById('paneMedia').innerHTML =
      '<section class="panel"><div class="panel-head"><h2>Files &amp; downloads</h2></div>' +
        '<div class="panel-body">' +
          '<div class="drop-zone" id="fileDrop">' +
            MB.icon('upload', 26) +
            '<div class="dz-t">Drop lesson files, PDFs or video</div>' +
            '<div class="dz-s">PDF, MP4, ZIP, XLSX &middot; up to 12 MB each, 6 at a time</div>' +
            '<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-pick="resFile">Browse files</button>' +
            '<div class="composer-previews" id="filePreviews" style="justify-content:center;padding-top:12px"></div>' +
          '</div>' +
          '<input type="file" id="resFile" multiple hidden accept=".pdf,.mp4,.zip,.xlsx,.xls,.docx,.csv,image/*">' +
          '<div class="alert alert-info" style="margin-top:16px"><span data-icon="info"></span>' +
            '<div class="t-xs">Uploads are held in the browser here. In production they go to ' +
            'object storage and the resource keeps only the storage key.</div></div>' +
        '</div></section>';
    MB.mountIcons(document.getElementById('paneMedia'));
    MB.uploads.attach({ drop:'#fileDrop', input:'#resFile', previews:'#filePreviews', accept:'any' });
  }

  /* ---- save ---- */
  document.getElementById('btnSave').addEventListener('click', function () {
    var title = (document.getElementById('eTitle') || {}).value;
    if (!title || !title.trim()) { MB.toast('Give the resource a title', 'err'); return; }
    var payload = {
      title: title.trim(),
      summary: document.getElementById('eSummary').value,
      type: document.getElementById('eType').value,
      level: document.getElementById('eLevel').value,
      status: document.getElementById('eStatus').value,
      market: document.getElementById('eMarket').value || null,
      has_certificate: document.getElementById('eCert').checked,
      access: access,
      price: access === 'paid' ? Number(document.getElementById('ePrice').value) : 0,
      currency: access === 'paid' ? document.getElementById('eCurrency').value : null,
      curriculum: curriculum,
      cover: MB.uploads.list('#coverDrop'),
      files: MB.uploads.list('#fileDrop')
    };
    (r.id ? MB.api.patch('admin/resources/' + r.id, payload) : MB.api.post('admin/resources', payload))
      .then(function () {
        MB.toast(r.id ? 'Resource saved' : 'Resource created');
        setTimeout(function () { location.href = 'resources.html'; }, 700);
      });
  });
  document.getElementById('btnPreview').addEventListener('click', function () {
    MB.toast('Opening learner preview…');
  });

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b) { return; }
    MB.$$('#tabs button').forEach(function (x) { x.classList.remove('is-active'); });
    b.classList.add('is-active');
    ['details','pricing','curriculum','media'].forEach(function (k) {
      document.getElementById('pane' + k.charAt(0).toUpperCase() + k.slice(1))
        .classList.toggle('hide', k !== b.getAttribute('data-t'));
    });
  });
});
</script>
</body>
</html>
