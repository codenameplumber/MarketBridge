<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users Management — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="admin" data-nav="users" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Users Management</h1>
        <div class="sub" id="pageSub">Search, review, suspend and manage accounts</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-primary btn-sm none" data-can="staff.invite"><span data-icon="plus"></span> Add User</button>
    </header>

    <main class="admin-body">
      
      <div id="stats"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  /* Horizontal stat band with working arrow controls */

MB.ready(function () {
  MB.api.list('admin/users').then(function (rows) {
    var active = rows.filter(function (u) { return u.status === 'active'; }).length;
    var providers = rows.filter(function (u) { return u.role === 'signal_provider'; }).length;
    var connected = rows.filter(function (u) { return u.deriv.connected; }).length;
    var balances = rows.reduce(function (a, u) { return a + (u.deriv.last_recorded_balance || 0); }, 0);
    var trades = rows.reduce(function (a, u) { return a + u.trading.total_trades; }, 0);

    MB.statSlider('#stats', 'Accounts', [
      { k: 'Total users', v: MB.fmt.compact(rows.length), d: 12.6 },
      { k: 'Active', v: MB.fmt.compact(active), d: 8.3 },
      { k: 'Signal providers', v: providers, d: 4.1 },
      { k: 'Deriv connected', v: connected + ' / ' + rows.length, d: 6.8 },
      { k: 'Balances (cached)', v: MB.fmt.money(balances, null, 0), note: 'read from Deriv' },
      { k: 'Trades placed', v: MB.fmt.compact(trades), d: 11.2 },
      { k: 'Banned', v: rows.filter(function (u) { return u.status === 'banned'; }).length,
        tone: 'danger', d: -2.4 }
    ]);

    MB.datatable({
      data: rows, into: '#table', perPage: 15, selectable: true, sortKey: 'username',
      searchPlaceholder: 'Search by name, username or email…',
      search: ['username','display_name','email'],
      columns: [
        { key:'username', label:'User', sortable:true,
          render: function (u) { return userCell(u.display_name, '@' + u.username, 'user-detail.html?u=' + u.username); } },
        { key:'role', label:'Role', sortable:true, filter:['user','signal_provider','moderator'],
          render: function (u) { return '<span class="c-2">' + u.role.replace(/_/g,' ') + '</span>'; } },
        { key:'status', label:'Status', sortable:true, filter:['active','inactive','banned'],
          render: function (u) { return statusBadge(u.status); } },
        { key:'trading.total_trades', label:'Trades', sortable:true, numeric:true,
          sortValue: function (u) { return u.trading.total_trades; },
          render: function (u) { return u.trading.total_trades; } },
        { key:'deriv.last_recorded_balance', label:'Balance', sortable:true, numeric:true,
          sortValue: function (u) { return u.deriv.last_recorded_balance; },
          render: function (u) {
            return u.deriv.connected
              ? '<span class="num">' + MB.fmt.money(u.deriv.last_recorded_balance) + '</span>' +
                '<div class="h c-3">' + MB.fmt.ago(u.deriv.balance_recorded_at) + '</div>'
              : '<span class="c-3">not connected</span>'; } },
        { key:'followers', label:'Followers', sortable:true, numeric:true,
          render: function (u) { return MB.fmt.compact(u.followers); } },
        { key:'last_seen_at', label:'Last seen', sortable:true,
          sortValue: function (u) { return new Date(u.last_seen_at).getTime(); },
          render: function (u) { return '<span class="c-3">' + MB.fmt.ago(u.last_seen_at) + '</span>'; } },
        { key:'', label:'Actions', align:'right',
          render: function (u) {
            return acts('<a class="row-action" href="user-detail.html?u=' + u.username + '" aria-label="View">' +
              MB.icon('eye', 15) + '</a>' +
              '<button class="row-action is-reject" data-can="user.suspend" aria-label="Suspend">' +
              MB.icon('ban', 15) + '</button>'); } }
      ]
    });
  });
});
</script>
</body>
</html>
