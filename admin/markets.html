<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="admin" data-nav="markets" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Markets</h1>
        <div class="sub" id="pageSub">The tradable catalogue and what can be executed on each</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <button class="btn btn-primary btn-sm none" id="btnNew" data-can="market.create"><span data-icon="plus"></span> Add market</button>
    </header>
    <main class="admin-body">
      
      <div id="stats"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  var ALL = [];

  MB.api.list('markets').then(function (rows) {
    ALL = rows;
    var byCat = {};
    rows.forEach(function (m) { byCat[m.category] = (byCat[m.category] || 0) + 1; });

    MB.statSlider('#stats', 'Catalogue', [
      { k:'Total markets', v: rows.length, spark:false },
      { k:'Synthetics', v: byCat.synthetic_indices || 0, spark:false },
      { k:'Derived', v: byCat.derived || 0, spark:false },
      { k:'Forex', v: byCat.forex || 0, spark:false },
      { k:'Crypto', v: byCat.crypto || 0, spark:false },
      { k:'Commodities', v: byCat.commodities || 0, spark:false },
      { k:'Indices', v: byCat.stock_indices || 0, spark:false },
      { k:'Binary-capable', v: rows.filter(function (m) { return m.is_binary; }).length, tone:'accent', spark:false },
      { k:'CFD only', v: rows.filter(function (m) { return m.is_cfd && !m.is_binary && !m.is_multiplier; }).length,
        tone:'warn', spark:false }
    ]);

    render();
  });

  function render() {
    MB.datatable({
      data: ALL, into: '#table', perPage: 20, sortKey: 'name',
      searchPlaceholder: 'Search markets, symbols or pairs…',
      search: ['name','symbol','pair'],
      columns: [
        { key:'name', label:'Market', sortable:true,
          render: function (m) {
            return '<div><div class="n">' + MB.esc(m.name) + '</div>' +
              '<div class="h c-3">' + MB.esc(m.symbol) + (m.pair ? ' · ' + MB.esc(m.pair) : '') + '</div></div>'; } },
        { key:'category', label:'Category', sortable:true,
          filter:['synthetic_indices','derived','forex','crypto','commodities','stock_indices'],
          render: function (m) { return '<span class="c-2">' + MB.catLabel(m.category) + '</span>'; } },
        { key:'', label:'Executable as', sortable:false,
          render: function (m) {
            var L = { binary:['Binary','badge-active'], multiplier:['Multipliers','badge-info'],
                      cfd_mt5:['CFD','badge-warn'] };
            return (m.contract_kinds || []).map(function (k) {
              var d = L[k] || [k,'badge-neutral'];
              return '<span class="badge ' + d[1] + '">' + d[0] + '</span>';
            }).join(' '); } },
        { key:'stats.last_price', label:'Price', sortable:true, numeric:true,
          sortValue: function (m) { return m.stats.last_price; },
          render: function (m) { return MB.fmt.price(m.stats.last_price, m.decimal_places); } },
        { key:'stats.change_pct_24h', label:'24h', sortable:true, numeric:true,
          sortValue: function (m) { return m.stats.change_pct_24h; },
          render: function (m) {
            var up = m.stats.change_pct_24h >= 0;
            return '<span class="' + (up ? 'c-up' : 'c-down') + '">' +
              MB.fmt.pct(m.stats.change_pct_24h) + '</span>'; } },
        { key:'community.member_count', label:'Room', sortable:true, numeric:true,
          sortValue: function (m) { return m.community.member_count; },
          render: function (m) {
            return '<a class="link" href="community-detail.html?c=room_' + m.symbol + '">' +
              MB.fmt.compact(m.community.member_count) + '</a>'; } },
        { key:'is_active', label:'Status', sortable:true,
          render: function (m) { return statusBadge(m.is_active ? 'active' : 'inactive'); } },
        { key:'', label:'Actions', align:'right',
          render: function (m) { return acts(
            '<button class="row-action" data-edit="' + m.symbol + '" aria-label="Edit">' +
              MB.icon('edit', 15) + '</button>'); } }
      ],
      done: function () {
        MB.$$('[data-edit]').forEach(function (b) {
          b.addEventListener('click', function () {
            var m = ALL.filter(function (x) { return x.symbol === b.getAttribute('data-edit'); })[0];
            openForm(m);
          });
        });
      }
    });
  }

  /* Add / edit form. Contract kinds are what decide whether signals on this
     market can ever be executable, so they are the core of the form. */
  function openForm(m) {
    var edit = !!m;
    var k = (m && m.contract_kinds) || [];
    openSO(edit ? 'Edit ' + m.short_name : 'Add a market',
      '<section class="panel"><div class="panel-body">' +
        '<div class="form-grid">' +
          '<div class="field"><label for="fName">Display name</label>' +
            '<input class="input" id="fName" value="' + (edit ? MB.esc(m.name) : '') +
            '" placeholder="Volatility 75 (1s) Index"></div>' +
          '<div class="field"><label for="fShort">Short name</label>' +
            '<input class="input" id="fShort" value="' + (edit ? MB.esc(m.short_name) : '') +
            '" placeholder="V75 (1s)"></div>' +
          '<div class="field"><label for="fSymbol">KonfluenX symbol</label>' +
            '<input class="input" id="fSymbol" value="' + (edit ? MB.esc(m.symbol) : '') +
            '" placeholder="1HZ75V"' + (edit ? ' readonly' : '') + '></div>' +
          '<div class="field"><label for="fDeriv">Deriv symbol</label>' +
            '<input class="input" id="fDeriv" value="' + (edit ? MB.esc(m.deriv_symbol) : '') +
            '" placeholder="1HZ75V"></div>' +
          '<div class="field"><label for="fPair">Pair (optional)</label>' +
            '<input class="input" id="fPair" value="' + (edit && m.pair ? MB.esc(m.pair) : '') +
            '" placeholder="EUR/USD"></div>' +
          '<div class="field"><label for="fCat">Category</label>' +
            '<select class="select" id="fCat">' +
            ['synthetic_indices','derived','forex','crypto','commodities','stock_indices'].map(function (c) {
              return '<option value="' + c + '"' + (edit && m.category === c ? ' selected' : '') + '>' +
                MB.catLabel(c) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="fDp">Decimal places</label>' +
            '<input class="input num" id="fDp" type="number" min="0" max="8" value="' +
            (edit ? m.decimal_places : 2) + '"></div>' +
          '<div class="field"><label for="fIcon">Icon key</label>' +
            '<input class="input" id="fIcon" value="' + (edit ? MB.esc(m.icon_key) : '') +
            '" placeholder="V75" maxlength="5"></div>' +
        '</div>' +

        '<div class="field" style="margin-top:20px">' +
          '<label>Executable as</label>' +
          '<span class="field-hint" style="margin-bottom:8px;display:block">This decides ' +
            'whether signals on this market can ever be executable. CFD-only markets ' +
            'always publish as analysis.</span>' +
          '<div class="stack g2">' +
            ['binary|Binary — Rise/Fall, Digits, Accumulators',
             'multiplier|Multipliers — leveraged, CFD-style',
             'cfd_mt5|CFD (MT5) — analysis only'].map(function (o) {
              var p = o.split('|');
              return '<label class="check" style="align-items:flex-start">' +
                '<input type="checkbox" data-kind="' + p[0] + '"' +
                  (k.indexOf(p[0]) > -1 ? ' checked' : '') + '>' +
                '<span class="box" style="margin-top:2px">' + MB.icon('check', 13) + '</span>' +
                '<span class="c-2">' + p[1] + '</span></label>';
            }).join('') +
          '</div></div>' +

        '<label class="check" style="margin-top:16px">' +
          '<input type="checkbox" id="fActive"' + (!edit || m.is_active ? ' checked' : '') + '>' +
          '<span class="box">' + MB.icon('check', 13) + '</span>' +
          '<span class="c-2">Active and visible to traders</span></label>' +
        '<label class="check" style="margin-top:10px">' +
          '<input type="checkbox" id="fRoom" checked>' +
          '<span class="box">' + MB.icon('check', 13) + '</span>' +
          '<span class="c-2">Create a community room for this market</span></label>' +

        '<div class="form-actions">' +
          (edit ? '<button class="btn btn-sell btn-sm" id="fDelete">Deactivate</button>' : '') +
          '<button class="btn btn-ghost btn-sm" id="fCancel">Cancel</button>' +
          '<button class="btn btn-primary btn-sm" id="fSave">' +
            (edit ? 'Save changes' : 'Create market') + '</button>' +
        '</div>' +
      '</div></section>');

    document.getElementById('fCancel').addEventListener('click', closeSO);
    document.getElementById('fSave').addEventListener('click', function () {
      var name = document.getElementById('fName').value.trim();
      var sym = document.getElementById('fSymbol').value.trim();
      if (!name || !sym) { MB.toast('Name and symbol are required', 'err'); return; }
      var kinds = MB.$$('[data-kind]').filter(function (c) { return c.checked; })
        .map(function (c) { return c.getAttribute('data-kind'); });
      if (!kinds.length) { MB.toast('Pick at least one contract kind', 'err'); return; }

      var payload = {
        name: name, short_name: document.getElementById('fShort').value.trim() || name,
        symbol: sym, deriv_symbol: document.getElementById('fDeriv').value.trim() || sym,
        pair: document.getElementById('fPair').value.trim() || null,
        category: document.getElementById('fCat').value,
        decimal_places: Number(document.getElementById('fDp').value),
        icon_key: document.getElementById('fIcon').value.trim() || sym.slice(0, 4),
        contract_kinds: kinds,
        is_active: document.getElementById('fActive').checked,
        create_room: document.getElementById('fRoom').checked
      };

      if (edit) {
        Object.assign(m, payload, {
          is_binary: kinds.indexOf('binary') > -1,
          is_multiplier: kinds.indexOf('multiplier') > -1,
          is_cfd: kinds.indexOf('cfd_mt5') > -1
        });
        MB.api.patch('admin/markets/' + m.symbol, payload);
        MB.toast(name + ' updated');
      } else {
        ALL.push(Object.assign({
          id: 'mkt_new_' + sym, is_binary: kinds.indexOf('binary') > -1,
          is_multiplier: kinds.indexOf('multiplier') > -1, is_cfd: kinds.indexOf('cfd_mt5') > -1,
          is_active: payload.is_active, is_favorite: false,
          stats: { last_price: 100, change_pct_24h: 0, updated_at: new Date().toISOString() },
          community: { member_count: 0, post_count: 0, online_count: 0 }
        }, payload));
        MB.api.post('admin/markets', payload);
        MB.toast(name + ' created' + (payload.create_room ? ' with a room' : ''));
      }
      closeSO(); render();
    });
    var del = document.getElementById('fDelete');
    if (del) {
      del.addEventListener('click', function () {
        if (!confirm('Deactivate ' + m.name + '? It will disappear from the app.')) { return; }
        m.is_active = false;
        MB.api.patch('admin/markets/' + m.symbol, { is_active: false });
        MB.toast(m.name + ' deactivated');
        closeSO(); render();
      });
    }
  }

  MB.on('#btnNew', 'click', function () { openForm(null); });
});
</script>
</body>
</html>
