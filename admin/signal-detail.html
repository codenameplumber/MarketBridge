<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — KonfluenX Admin</title>
<meta name="theme-color" content="#080B0F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){var t='dark';try{t=localStorage.getItem('mb.theme')||'dark';}catch(e){}var m=/[?&]theme=(dark|light|system)\b/.exec(location.search);if(m){t=m[1];}if(t!=='system'){document.documentElement.setAttribute('data-theme',t);}})();</script>
</head>
<body data-shell="admin" data-role="admin" data-nav="signals" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      <a class="icon-btn none" href="signals.html" aria-label="Back"><span data-icon="back"></span></a>
      <div class="grow">
        <h1 id="pageTitle">Signal</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      
    </header>
    <main class="admin-body">
      
      <div class="detail-hero" id="hero"></div>
      <div id="stats"></div>
      <div class="detail-cols" id="panes"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/roles.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  var id = new URLSearchParams(location.search).get('id');
  MB.api.list('signals').then(function (rows) {
    var s = rows.filter(function (x) { return x.id === id; })[0] || rows[0];
    var exec = s.kind === 'executable';
    var isSell = s.direction === 'sell';

    document.getElementById('pageTitle').textContent =
      (s.direction || '').toUpperCase() + ' ' + s.market.short_name;
    document.getElementById('pageSub').textContent =
      s.kind + ' · by @' + s.author.username + ' · ' + MB.fmt.ago(s.published_at);

    document.getElementById('hero').innerHTML =
      MB.avatar(s.author, 'avatar-xl') +
      '<div class="dh-main">' +
        '<div class="dh-name">' + MB.esc((s.direction||'').toUpperCase() + ' ' + s.market.name) + '</div>' +
        '<div class="dh-sub">Published ' + MB.fmt.date(s.published_at) + ' by ' +
          '<a class="link" href="user-detail.html?u=' + s.author.username + '">@' +
          MB.esc(s.author.username) + '</a></div>' +
        '<div class="dh-badges">' +
          '<span class="signal-kind ' + (exec ? 'k-exec' : 'k-anal') + '">' +
            (exec ? 'EXECUTABLE' : 'ANALYSIS') + '</span>' +
          statusBadge(s.status) +
          '<span class="badge badge-neutral">' + MB.catLabel(s.market.category) + '</span>' +
          '<span class="badge badge-neutral">' + MB.esc(s.market.symbol) + '</span>' +
          (s.boost && s.boost.is_boosted ? '<span class="badge badge-boost">Boosted</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="dh-actions">' +
        /* Boosting is paid placement — an operator power, not a moderator one. */
        '<button class="btn btn-ghost btn-sm" id="btnBoost" data-can="boost.create boost.cancel">' +
          '<span data-icon="megaphone"></span> ' +
          (s.boost && s.boost.is_boosted ? 'Remove boost' : 'Boost') + '</button>' +
        '<button class="btn btn-ghost btn-sm" data-can="report.escalate">' +
          '<span data-icon="flag"></span> Flag</button>' +
        '<button class="btn btn-sell btn-sm" id="btnHide" data-can="signal.unlist">' +
          '<span data-icon="eyeoff"></span> Hide</button>' +
        '<button class="btn btn-sell btn-sm" id="btnDelete" data-can="signal.delete">' +
          '<span data-icon="trash"></span> Delete</button>' +
      '</div>';

    if (MB.applyPermissions) { MB.applyPermissions(document); }

    var e = s.engagement;
    MB.statSlider('#stats', 'Reach and outcome', [
      { k:'Views', v: MB.fmt.compact(e.views), d: 12.4 },
      { k:'Likes', v: e.likes, d: 6.1 },
      { k:'Comments', v: e.comments, d: 3.8 },
      { k:'Shares', v: e.shares, d: 2.2 },
      { k:'Provider win rate', v: (s.author.win_rate || 0) + '%', spark:false },
      { k:'Provider signals', v: s.author.signals_count, spark:false },
      { k:'Outcome', v: s.result ? s.result.outcome : 'pending',
        tone: s.result ? (s.result.outcome === 'won' ? 'accent' : 'danger') : 'warn', spark:false }
    ]);

    var levels = '';
    if (exec) {
      var p = (s.execution && s.execution.params) || {};
      levels = row('Contract family', MB.esc(s.execution.contract_family)) +
        row('Contract type', '<code>' + MB.esc(s.execution.contract_type) + '</code>') +
        row('Capability', '<code>' + MB.esc(s.execution.capability_id) + '</code>') +
        Object.keys(p).map(function (k) {
          return row(k.replace(/_/g,' '), MB.esc(String(p[k])));
        }).join('') +
        row('Stake range', s.execution.stake_min + ' – ' + s.execution.stake_max);
    } else {
      var a = s.analysis || {};
      var dp = s.market.decimal_places;
      levels = row('Entry', '<span class="num">' + MB.fmt.price(a.entry_price, dp) + '</span>') +
        row('Stop loss', '<span class="num c-down">' + MB.fmt.price(a.stop_loss, dp) + '</span>') +
        (a.take_profits || []).map(function (t, i) {
          return row('Take profit ' + (i+1), '<span class="num c-up">' + MB.fmt.price(t, dp) + '</span>');
        }).join('') +
        row('Timeframe', MB.esc(a.timeframe)) +
        row('Risk / reward', '1:' + a.risk_reward);
    }

    document.getElementById('panes').innerHTML =
      '<section class="panel"><div class="panel-head"><h2>Chart &amp; body</h2></div>' +
        '<div class="panel-body">' +
          '<div class="chart-frame" style="border-radius:10px">' +
            '<span class="tf">' + (exec ? '1m' : (s.analysis && s.analysis.timeframe) || 'H1') + '</span>' +
            '<div data-chart="candle" data-seed="' + s.id + '" data-h="230" data-direction="' +
              (isSell ? 'down' : 'up') + '"' + (exec ? '' : ' data-levels=\'{"entry":1,"sl":1,"tp1":1}\'') + '></div>' +
          '</div>' +
          '<p class="t-sm c-2" style="margin-top:16px">' + MB.esc(s.body) + '</p>' +
          '<div class="post-tags" style="margin-top:12px">' +
            (s.tags||[]).map(function (t) { return '<span class="chip-tag">' + MB.esc(t) + '</span>'; }).join('') +
          '</div></div></section>' +

      '<div class="stack g4">' +
        '<section class="panel"><div class="panel-head"><h2>' +
          (exec ? 'Execution parameters' : 'Analysis levels') + '</h2></div>' +
          '<div class="panel-body"><div class="info-list">' + levels + '</div>' +
          (exec
            ? '<div class="alert alert-green" style="margin-top:16px"><span data-icon="check"></span>' +
              '<div class="t-xs">Executable — resolved from the real Deriv contract.</div></div>'
            : '<div class="alert alert-info" style="margin-top:16px"><span data-icon="info"></span>' +
              '<div class="t-xs">Analysis — no Deriv contract exists for this idea, so it resolves ' +
              'against the price feed and can never show a trade button.</div></div>') +
          '</div></section>' +

        '<section class="panel"><div class="panel-head"><h2>Provenance</h2></div>' +
          '<div class="panel-body"><div class="info-list">' +
            row('Signal ID', '<code>' + MB.esc(s.id) + '</code>') +
            row('Provider', '<a class="link" href="user-detail.html?u=' + s.author.username + '">@' +
              MB.esc(s.author.username) + '</a>') +
            row('Market', MB.esc(s.market.name), s.market.symbol) +
            row('Category', MB.catLabel(s.market.category)) +
            row('Published', MB.fmt.date(s.published_at)) +
            row('Locked', 'Yes — immutable since publish') +
            (s.result
              ? row('Resolved by', s.result.resolved_by.replace(/_/g,' ')) +
                row('Verification', s.result.verification_status) +
                row('Hit level', (s.result.hit_level || '—').toUpperCase()) +
                row('Resolved at', MB.fmt.date(s.result.resolved_at))
              : row('Result', 'Not yet resolved')) +
          '</div></div></section>' +
      '</div>';

    MB.mountIcons(); MB.mountCharts();
    MB.on('#btnBoost', 'click', function () {
      MB.api.post('admin/signals/' + s.id + '/boost');
      MB.toast('Boost updated');
    });
    MB.on('#btnHide', 'click', function () {
      if (!confirm('Hide this signal from all feeds?')) { return; }
      MB.api.patch('admin/signals/' + s.id, { status: 'hidden' });
      MB.toast('Signal hidden');
    });
  });
});
</script>
</body>
</html>
